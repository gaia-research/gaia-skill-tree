budgets:
  maxObservationsPerRun: 1000

repairs:
  maxRepairsPerRun: 2
  executors:
    agent-skill-mirror:
      debtKind: agent_skill_mirror_drift
      authority: A
      canonicalPath: .agents/skills/**
      writablePath: .claude/skills/**
      allowedCommands:
        - git status --porcelain=v1 --untracked-files=all -- .claude/skills
        - python scripts/sync_agent_skill_mirror.py --check
      stopConditions:
        - canonical input is missing, symlinked, non-regular, or changes during repair
        - mirror contains a mirror-only path, a symlink, or a dirty user edit
        - a locally owned mirror path cannot be carried across the atomic replacement
        - staged copy, atomic replacement, recursive parity, or sync validation cannot be proven
    bundled-schema-mirror:
      debtKind: bundled_schema_mirror_drift
      authority: A
      canonicalPath: registry/schema/**
      writablePath: src/gaia_cli/data/registry/schema/**
      allowedCommands:
        - git status --porcelain=v1 --untracked-files=all -- src/gaia_cli/data/registry/schema
        - python scripts/sync_bundled_schemas.py --check
      stopConditions:
        - canonical input is missing, symlinked, non-regular, non-JSON, or changes during repair
        - mirror contains an extra path, a symlink, or a dirty user edit
        - staged copy, atomic replacement, recursive parity, or sync validation cannot be proven

routing:
  maxDispatchesPerRun: 1
  # The bounded Class B rolling lane. These three numbers are the whole of what
  # makes it a lane rather than a loop, and code caps each of them independently
  # so editing this file can never grant unbounded autonomy.
  lane:
    # Never more outstanding work than a human can actually review. Raised from
    # 1 to 2 by founder authorization 2026-10-21 (steward-class-b-throughput).
    maxInFlight: 2
    # A debt that fails bounded repair this many times is not asking for another
    # attempt; it is evidence the envelope is wrong, which is a founder question.
    maxAttempts: 2
    # A just-rejected debt is not immediately re-dispatchable, so a broken loop
    # cannot spend an afternoon rediscovering the same rejection.
    cooldownSeconds: 3600
  budget:
    modelCalls: 0
    maxTokens: 0
    maxMinutes: 0
  dispatchRules:
    registry-integrity-review:
      debtKind: registry_integrity_failed
      authority: B
      routine: gaia-registry-integrity-review
      promptGuide: founder/steward/routines/registry-integrity-review.md
      # What reasoning the work demands, stated generally. Never a model, a
      # provider, or a harness — founder ruling 2026-08-13, STEWARD.md § 9.
      # This is a suggestion for whoever schedules the work; it gates nothing,
      # and a stronger reasoner never receives a wider envelope.
      capability: >-
        Sustained reasoning across many files with a schema and a graph held in
        mind at once, plus the discipline to express a correction as a command
        sequence rather than an edit. A fast pattern-matching pass will produce
        a plausible fix that violates a constraint it never loaded.
      objective: >-
        Reproduce the reported registry-integrity failure, diagnose its exact
        cause, and return the smallest policy-compliant correction as a
        reviewable proposal with independent proof. Canonical registry nodes
        are mutated only by a Verifier running gaia dev verbs, so the
        correction is delivered as that verb sequence, never as an edit.
      allowedPaths:
        - scripts/**
        - tests/**
      allowedCommands:
        - python scripts/validate.py
        - python scripts/sync_bundled_schemas.py --check
        - python -m pytest
      forbiddenPaths:
        - .agents/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/**
        - founder/**
        - registry/**
        - skill-trees/**
      stopConditions:
        - fresh local evidence does not reproduce the packet violation
        - the correction requires a write outside allowedPaths
        - the correction requires a Class C product or governance decision
        - the correction cannot be expressed as a gaia dev verb sequence
        - validation, coverage, or independent proof is incomplete
      proof:
        - reproduce every packet violation from local repository state
        - show a diff confined to allowedPaths
        - state the exact gaia dev verb sequence a Verifier should run
        - run the packet validation commands that apply to the correction
        - obtain independent review before integration
    trust-calibration-drift:
      debtKind: trust_calibration_drift
      authority: B
      routine: gaia-trust-calibration-steward
      promptGuide: founder/steward/routines/trust-calibration-drift.md
      capability: >-
        Compare computed Trust Magnitude grades with stored named-skill levels
        and express approved corrections as gaia dev calibrate commands without
        mutating registry data automatically.
      objective: >-
        Reproduce each stale rank, verify the G7 target, and return a bounded
        calibration command sequence for human approval.
      allowedPaths:
        - src/gaia_cli/steward/**
        - tests/steward/**
      allowedCommands:
        - python -m pytest tests/steward/test_sensors.py
        - gaia steward scan
        - python scripts/inspectTrustMagnitude.py --skill <skill_id>
      forbiddenPaths:
        - .agents/skills/**
        - .gaia/steward/**
        - .github/**
        - founder/**
        - registry/**
        - skill-trees/**
        - docs/**
      stopConditions:
        - computed grade or target level cannot be reproduced locally
        - correction requires automatic registry mutation
        - validation or focused coverage is incomplete
      proof:
        - reproduce every reported stale level from local registry state
        - show the exact gaia dev calibrate command for each approved correction
        - run focused sensor tests and Steward validation
        - obtain independent review before integration
    cli-contract-drift:
      debtKind: cli_contract_drift
      authority: B
      routine: gaia-cli-contract-steward
      promptGuide: founder/steward/routines/cli-contract-drift.md
      capability: >-
        Careful reading of a command surface against its own declarations, and
        the judgement to tell an omission from a deliberate hidden verb. The
        cheap answer — add every missing name to the public list — is usually
        wrong; some commands are unlisted on purpose and the correction is to
        say so.
      objective: >-
        Reproduce the reported command-surface inconsistency, decide for each
        violation whether the code or the declaration is the defect, and return
        the smallest correction as a reviewable proposal. Anything that changes
        what a user sees in `gaia help` is founder-gated, so it ships as a
        proposal with before/after output, never as a merge.
      allowedPaths:
        - src/gaia_cli/**
        - tests/**
      allowedCommands:
        - PYTHONPATH=src python -m gaia_cli.main --help
        - PYTHONPATH=src python -m gaia_cli.main help
        - python -m pytest tests/
      forbiddenPaths:
        - .agents/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/**
        - founder/**
        - registry/**
        - skill-trees/**
      stopConditions:
        - fresh local state does not reproduce a reported violation
        - the correction requires editing the agent contract or another document
          outside allowedPaths
        - whether a command should be public is a product decision rather than
          an omission
        - the correction would change a command's behaviour rather than its
          declaration
        - validation, coverage, or independent proof is incomplete
      proof:
        - reproduce every reported violation from local repository state
        - show a diff confined to allowedPaths
        - show the before and after of the rendered help surface
        - state which violations are NOT fixable inside this envelope and why
        - run the packet validation commands that apply to the correction
        - obtain independent review before integration
    repository-hygiene:
      debtKind: repository_hygiene
      authority: B
      routine: repository-hygiene
      promptGuide: founder/steward/routines/repository-hygiene.md
      capability: >-
        Compare the bounded tracked-file inventory with an explicit generated-artifact allowlist,
        distinguish known intentional catalog state from a real leak, and stop when repair authority
        or source ownership is ambiguous.
      objective: >-
        Reproduce the enumerated tracked Class P finding and return a focused, reviewable proposal.
        This is report-only work: do not delete tracked files, alter canonical skills, or edit repository
        root or founder policy surfaces; those changes require their owners' approval.
      allowedPaths:
        - scripts/**
        - tests/steward/**
      allowedCommands:
        - git status --short
        - git ls-files -- registry/gaia.json registry/gaia.gexf registry/gaia.svg registry/named-skills.json registry/layouts_3d.json base_gaia.json src/gaia_cli/data/registry/gaia.json src/gaia_cli/data/registry/named-skills.json
        - python -m pytest tests/steward/test_repository_hygiene.py
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/graph/**
        - founder/**
        - registry/**
        - registry/schema/**
        - skill-trees/**
        - src/**
      stopConditions:
        - a proposed change would remove or rewrite tracked Class P data; return diagnosis and stop without deleting
        - the finding requires changing a canonical skill, repository-root file, or founder-owned surface
        - generator ownership or the authoritative source for an artifact is not proven
        - the correction depends on dynamic execution, external behavior, or an unbounded inventory
        - the finding is not reproduced or focused validation and independent review are incomplete
      proof:
        - reproduce the finding using the read-only tracked-path inventory
        - show a diff confined to the allowed paths and preserve all policy floors
        - run the focused repository hygiene tests and report exact results
        - obtain independent review before integration
    unused-import-cleanup:
      debtKind: unused_import
      authority: B
      routine: dead-code-gardener
      promptGuide: founder/steward/routines/unused-import-cleanup.md
      capability: >-
        Remove module-level imports that the dead-code detector proved have no in-module read,
        keeping side-effect imports, re-exports and guarded imports, and prove the package still
        imports and its tests pass.
      objective: >-
        Reproduce the unused-import finding for the one subject file, remove only the imports the
        packet names, and return the smallest diff with focused proof. Touch no other file.
      allowedPaths:
        - src/gaia_cli/**
        - scripts/**
        - tests/**
      allowedCommands:
        - python -m pytest
        - python -m compileall
        - gaia steward scan
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/**
        - founder/**
        - registry/**
        - skill-trees/**
      stopConditions:
        - the diff touches any file other than the debt's subject file
        - a flagged import is marked sideEffectPossible and its side effect is not proven absent
        - the file is an __init__.py re-export surface, a star import or a guarded import
        - tests or compileall of the file fail after the change
        - the finding does not reproduce on the current head
      proof:
        - reproduce the finding for the subject file
        - show a diff confined to the subject file
        - run python -m pytest on the importing package and python -m compileall on the file
        - obtain independent review before integration
    knowledge-contradiction:
      debtKind: knowledge_contradiction
      authority: B
      routine: knowledge-contradiction
      promptGuide: founder/steward/routines/knowledge-contradiction.md
      capability: >-
        Compare bounded authoritative documents, establish which source governs the fact, and
        distinguish a correctable stale statement from history or an unsettled product decision.
      objective: >-
        Reproduce one exact contradiction in the permitted agent-document surface and return the
        smallest reviewable proposal. Stop when source precedence or semantic meaning is disputed.
      allowedPaths:
        - docs/agents/**
        - tests/steward/**
      allowedCommands:
        - git status --short
        - python -m pytest tests/steward/test_sensors.py
        - python -m pytest tests/steward/test_repository_hygiene.py
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/graph/**
        - founder/**
        - registry/**
        - registry/schema/**
        - skill-trees/**
        - src/**
      stopConditions:
        - semantic meaning, product policy, or source precedence is ambiguous
        - the apparent disagreement is historical, archived, or describes a past state
        - the correction requires a canonical skill, root, founder, registry, Class S, or source edit
        - a correction would widen authority or weaken any hard floor
        - focused validation or independent review is incomplete
      proof:
        - reproduce the exact incompatible statements and establish their authoritative source
        - show a diff confined to docs/agents/** and tests/steward/**
        - run the applicable focused read-only checks and report exact results
        - obtain independent review before integration
    issue-suite-review:
      debtKind: issue_suite_review
      authority: B
      routine: issue-hygiene
      promptGuide: founder/steward/routines/issue-hygiene.md
      capability: >-
        Careful reading of one batch of related GitHub issues against the registry
        records they claim to duplicate, superseded or curated, distinguishing a
        provably preserved payload from a similar title, and expressing each
        disposition as a reviewable proposal rather than an action.
      objective: >-
        Review exactly one suite batch named by the packet, check every row against
        its registry evidence, and return a disposition proposal file that marks each
        item as proven, needing curation, or a founder question. Closing issues and
        accepting candidates are never part of this work.
      allowedPaths:
        - docs/agents/issue-hygiene/**
        - tests/steward/**
      allowedCommands:
        - python -m pytest tests/steward/issuehygiene
        - python scripts/check_steward_coverage.py --check
        - gh issue view <number> --json number,title,state,labels,body
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/graph/**
        - founder/**
        - registry/**
        - skill-trees/**
        - src/**
      stopConditions:
        - the packet names more than one suite batch
        - a row's registry evidence cannot be read from local repository state
        - a disposition would close an issue or accept a candidate
        - the correction requires a registry mutation outside gaia dev verbs
        - the payload preservation proof for a row is incomplete
      proof:
        - reproduce every disposition from the census and local registry state
        - show a diff confined to docs/agents/issue-hygiene and tests/steward
        - run the focused issue-hygiene tests and report exact results
        - obtain independent review before integration
  founderRules:
    issue-founder-decision:
      debtKind: issue_founder_decision
      authority: C
      decisionTargetField: decisionTarget
      objective: >-
        Decide one exact issue-hygiene question shared by the affected issues, such as
        whether a family of upstream candidates is accepted, rejected or deferred.
    generic-mapping-decision:
      debtKind: generic_mapping
      authority: C
      decisionTargetField: decisionTarget
      objective: Decide the canonical generic mapping for the explicit normalized target.

# Issue hygiene (#2130). Policy may narrow this section; code caps and rule ids are pinned in
# src/gaia_cli/steward/issuehygiene/hygienepolicy.py. Absent section => no closure authority.
issueHygiene:
  maxClosuresPerRun: 10
  maxCensusAgeSeconds: 21600
  closedWindowDays: 30
  # Rollout (contract section 6): dry-run first. Pilot closures run only through
  # scripts/steward_issue_reconcile.py --apply-closures, which goes through the same gate as
  # scripts/steward_issue_close.py and reads this writesEnabled too. A pilot therefore needs writesEnabled
  # true, set in a throwaway checkout and never committed. The explicit flags are necessary, not sufficient.
  writesEnabled: false
  enabledRules:
    - A1-child-curated
    - A2-umbrella-synced
    - A3-umbrella-superseded
    - A4-duplicate-child
    - A5-botreport-superseded
  # Workflow files whose disabled state proves a bot family is no longer running (A5).
  # Empty = A5 can never be proven, so it stays Class B/C.
  a5Disabled: []
