budgets:
  maxObservationsPerRun: 1000

repairs:
  maxRepairsPerRun: 2
  executors:
    agent-skill-mirror:
      debtKind: agent_skill_mirror_drift
      authority: A
      canonicalPath: .agents/skills/**
      writablePath: .claude/skills/**
      allowedCommands:
        - git status --porcelain=v1 --untracked-files=all -- .claude/skills
        - python scripts/sync_agent_skill_mirror.py --check
      stopConditions:
        - canonical input is missing, symlinked, non-regular, or changes during repair
        - mirror contains a mirror-only path, a symlink, or a dirty user edit
        - a locally owned mirror path cannot be carried across the atomic replacement
        - staged copy, atomic replacement, recursive parity, or sync validation cannot be proven
    bundled-schema-mirror:
      debtKind: bundled_schema_mirror_drift
      authority: A
      canonicalPath: registry/schema/**
      writablePath: src/gaia_cli/data/registry/schema/**
      allowedCommands:
        - git status --porcelain=v1 --untracked-files=all -- src/gaia_cli/data/registry/schema
        - python scripts/sync_bundled_schemas.py --check
      stopConditions:
        - canonical input is missing, symlinked, non-regular, non-JSON, or changes during repair
        - mirror contains an extra path, a symlink, or a dirty user edit
        - staged copy, atomic replacement, recursive parity, or sync validation cannot be proven

routing:
  # Builds one run may hand out in parallel. Code requires 1 <= this <= lane.maxInFlight.
  # Raised from 1 to 8 by founder decision steward-class-b-throughput-2026-11-06: the run
  # lease serializes runs, so a lane maxInFlight of 2 alone never produced parallel dispatch.
  maxDispatchesPerRun: 8
  # The bounded Class B rolling lane. These three numbers are the whole of what
  # makes it a lane rather than a loop, and code caps each of them independently
  # so editing this file can never grant unbounded autonomy.
  lane:
    # Never more outstanding work than a human can actually review. Raised from
    # 1 to 2 by founder authorization 2026-10-21 (steward-class-b-throughput), then
    # from 2 to 8 (the finite code ceiling: the most one pi subagent call takes) by
    # founder decision steward-class-b-throughput-2026-11-06.
    maxInFlight: 8
    # A debt that fails bounded repair this many times is not asking for another
    # attempt; it is evidence the envelope is wrong, which is a founder question.
    maxAttempts: 2
    # A just-rejected debt is not immediately re-dispatchable, so a broken loop
    # cannot spend an afternoon rediscovering the same rejection.
    cooldownSeconds: 3600
  budget:
    modelCalls: 0
    maxTokens: 0
    maxMinutes: 0
  dispatchRules:
    registry-integrity-review:
      debtKind: registry_integrity_failed
      authority: B
      routine: gaia-registry-integrity-review
      promptGuide: founder/steward/routines/registry-integrity-review.md
      # What reasoning the work demands, stated generally. Never a model, a
      # provider, or a harness — founder ruling 2026-08-13, STEWARD.md § 9.
      # This is a suggestion for whoever schedules the work; it gates nothing,
      # and a stronger reasoner never receives a wider envelope.
      capability: >-
        Sustained reasoning across many files with a schema and a graph held in
        mind at once, plus the discipline to express a correction as a command
        sequence rather than an edit. A fast pattern-matching pass will produce
        a plausible fix that violates a constraint it never loaded.
      objective: >-
        Reproduce the reported registry-integrity failure, diagnose its exact
        cause, and return the smallest policy-compliant correction as a
        reviewable proposal with independent proof. Canonical registry nodes
        are mutated only by a Verifier running gaia dev verbs, so the
        correction is delivered as that verb sequence, never as an edit.
      allowedPaths:
        - scripts/**
        - tests/**
      allowedCommands:
        - python scripts/validate.py
        - python scripts/sync_bundled_schemas.py --check
        - python -m pytest
      forbiddenPaths:
        - .agents/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/**
        - founder/**
        - registry/**
        - skill-trees/**
      stopConditions:
        - fresh local evidence does not reproduce the packet violation
        - the correction requires a write outside allowedPaths
        - the correction requires a Class C product or governance decision
        - the correction cannot be expressed as a gaia dev verb sequence
        - validation, coverage, or independent proof is incomplete
      proof:
        - reproduce every packet violation from local repository state
        - show a diff confined to allowedPaths
        - state the exact gaia dev verb sequence a Verifier should run
        - run the packet validation commands that apply to the correction
        - obtain independent review before integration
    trust-calibration-drift:
      debtKind: trust_calibration_drift
      authority: B
      routine: gaia-trust-calibration-steward
      promptGuide: founder/steward/routines/trust-calibration-drift.md
      # Founder ruling F1 (2026-11-08, decision steward-class-b-route-trust-calibration-2283):
      # below-ceiling promotions are executable Class B. policy.py pins registry/named/**
      # to this rule and debt kind in both directions; the packet's eligibility (promotion
      # only, never frozen, never over a recorded demotion, never cap-only suite to 3★+,
      # never a refused preflight) is enforced in code by calibrationroute.py at the
      # sensor, at dispatch and at verification. Class S artifacts are never written by
      # a packet: the lead regenerates them once per integrated wave.
      capability: >-
        Confirm that one named skill's stored level sits below the level its recomputed Trust
        Magnitude grade allows, that the canonical calibrate preflights accept the promotion, and
        perform exactly that one governed calibration with the canonical verb, refusing rather than
        working around any gate.
      objective: >-
        For the one subject skill, reproduce the below-ceiling finding on the current head, run
        exactly one `gaia dev calibrate <skill_id> <target_level> --no-build` to the packet's grade
        target, and return the diff the verb wrote (that skill's registry record only, with its
        timeline event). A refused preflight is a stop with no change. Never edit the record by
        hand, never regenerate docs, never touch another skill.
      allowedPaths:
        - registry/named/**
      allowedCommands:
        - gaia dev calibrate <skill_id> <target_level> --no-build
        - python scripts/inspectTrustMagnitude.py --skill <skill_id>
        - gaia steward scan
        - python -m pytest tests/steward/test_calibration_route.py
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/**
        - founder/**
        - registry/nodes/**
        - registry/schema/**
        - skill-trees/**
      stopConditions:
        - the finding does not reproduce on the current head, or its stored level or target differs from the packet
        - the finding is lane-ineligible (ceiling-exceeded, frozen, last rank event a recorded demotion, cap-only suite component to 3★ or higher, or a refused or unevaluable preflight)
        - gaia dev calibrate exits non-zero (a refused preflight); report no_change and do not retry another way
        - the diff touches any path other than the subject skill's registry/named record
        - the verb would need --no-build removed, a docs regeneration, or a hand edit
      proof:
        - reproduce the below-ceiling finding for the subject skill on the current head, with stored level, recomputed Trust Magnitude, grade and target
        - run exactly one gaia dev calibrate <skill_id> <target_level> --no-build and report its exact output and exit code
        - show a diff confined to the subject skill's registry/named record, with the appended rank_up timeline event
        - obtain independent review before integration
    cli-contract-drift:
      debtKind: cli_contract_drift
      authority: B
      routine: gaia-cli-contract-steward
      promptGuide: founder/steward/routines/cli-contract-drift.md
      capability: >-
        Careful reading of a command surface against its own declarations, and
        the judgement to tell an omission from a deliberate hidden verb. The
        cheap answer — add every missing name to the public list — is usually
        wrong; some commands are unlisted on purpose and the correction is to
        say so.
      objective: >-
        Reproduce the reported command-surface inconsistency, decide for each
        violation whether the code or the declaration is the defect, and return
        the smallest correction as a reviewable proposal. Anything that changes
        what a user sees in `gaia help` is founder-gated, so it ships as a
        proposal with before/after output, never as a merge.
      allowedPaths:
        - src/gaia_cli/**
        - tests/**
      allowedCommands:
        - PYTHONPATH=src python -m gaia_cli.main --help
        - PYTHONPATH=src python -m gaia_cli.main help
        - python -m pytest tests/
      forbiddenPaths:
        - .agents/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/**
        - founder/**
        - registry/**
        - skill-trees/**
      stopConditions:
        - fresh local state does not reproduce a reported violation
        - the correction requires editing the agent contract or another document
          outside allowedPaths
        - whether a command should be public is a product decision rather than
          an omission
        - the correction would change a command's behaviour rather than its
          declaration
        - validation, coverage, or independent proof is incomplete
      proof:
        - reproduce every reported violation from local repository state
        - show a diff confined to allowedPaths
        - show the before and after of the rendered help surface
        - state which violations are NOT fixable inside this envelope and why
        - run the packet validation commands that apply to the correction
        - obtain independent review before integration
    repository-hygiene:
      debtKind: repository_hygiene
      authority: B
      routine: repository-hygiene
      promptGuide: founder/steward/routines/repository-hygiene.md
      capability: >-
        Compare the bounded tracked-file inventory with an explicit generated-artifact allowlist,
        distinguish known intentional catalog state from a real leak, and stop when repair authority
        or source ownership is ambiguous.
      objective: >-
        Reproduce the enumerated tracked Class P finding and return a focused, reviewable proposal.
        This is report-only work: do not delete tracked files, alter canonical skills, or edit repository
        root or founder policy surfaces; those changes require their owners' approval.
      allowedPaths:
        - scripts/**
        - tests/steward/**
      allowedCommands:
        - git status --short
        - git ls-files -- registry/gaia.json registry/gaia.gexf registry/gaia.svg registry/named-skills.json registry/layouts_3d.json base_gaia.json src/gaia_cli/data/registry/gaia.json src/gaia_cli/data/registry/named-skills.json
        - python -m pytest tests/steward/test_repository_hygiene.py
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/graph/**
        - founder/**
        - registry/**
        - registry/schema/**
        - skill-trees/**
        - src/**
      stopConditions:
        - a proposed change would remove or rewrite tracked Class P data; return diagnosis and stop without deleting
        - the finding requires changing a canonical skill, repository-root file, or founder-owned surface
        - generator ownership or the authoritative source for an artifact is not proven
        - the correction depends on dynamic execution, external behavior, or an unbounded inventory
        - the finding is not reproduced or focused validation and independent review are incomplete
      proof:
        - reproduce the finding using the read-only tracked-path inventory
        - show a diff confined to the allowed paths and preserve all policy floors
        - run the focused repository hygiene tests and report exact results
        - obtain independent review before integration
    unused-import-cleanup:
      debtKind: unused_import
      authority: B
      routine: dead-code-gardener
      promptGuide: founder/steward/routines/unused-import-cleanup.md
      capability: >-
        Remove module-level imports that the dead-code detector proved have no in-module read,
        keeping side-effect imports, re-exports and guarded imports, and prove the package still
        imports and its tests pass.
      objective: >-
        Reproduce the unused-import finding for the one subject file, remove only the imports the
        packet names, and return the smallest diff with focused proof. Touch no other file.
      allowedPaths:
        - src/gaia_cli/**
        - scripts/**
        - tests/**
      allowedCommands:
        - python -m pytest
        - python -m compileall
        - gaia steward scan
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/**
        - founder/**
        - registry/**
        - skill-trees/**
      stopConditions:
        - the diff touches any file other than the debt's subject file
        - a flagged import is marked sideEffectPossible and its side effect is not proven absent
        - the file is an __init__.py re-export surface, a star import or a guarded import
        - tests or compileall of the file fail after the change
        - the finding does not reproduce on the current head
      proof:
        - reproduce the finding for the subject file
        - show a diff confined to the subject file
        - run python -m pytest on the importing package and python -m compileall on the file
        - obtain independent review before integration
    swallowed-exception-repair:
      debtKind: swallowed_exception
      authority: B
      routine: error-handling-steward
      promptGuide: founder/steward/routines/swallowed-exception-repair.md
      capability: >-
        Understand Python exception hierarchies and error-handling control flow, narrow broad
        handlers to expected exception types or add contextual logging while preserving existing
        fallback and return semantics, or mark intentional degradation with the documented intent marker.
      objective: >-
        For one subject file with swallowed-exception findings, repair each flagged handler by
        narrowing the exception type to what the body raises, adding contextual logging while preserving
        fallback behavior, or marking intentional suppression with '# steward: best-effort: <reason>'.
        Return the smallest diff confined to the subject file with focused test proof.
      allowedPaths:
        - scripts/**
        - src/gaia_cli/**
      allowedCommands:
        - python -m py_compile <file>
        - python -m pytest
        - gaia steward scan
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/**
        - founder/**
        - registry/**
        - skill-trees/**
      stopConditions:
        - the diff touches any file other than the debt's subject file
        - the diff modifies lines outside except clauses, their comments, or handler logging
        - the change alters control flow, return values, loop continuation, or raises new unhandled exceptions
        - syntax checking or compilation of the subject file fails
        - focused tests for the subject file fail or regress
        - the finding does not reproduce on the current head
        - the finding count for the subject file does not decrease
        - the handler's try body, else or finally is not proven side-effect-free under the positive envelope, or a value it binds reaches a write, an unclassified call or a decision guard; escalate to engineering
      proof:
        - reproduce the swallowed_exception finding on the subject file
        - show a diff confined to the subject file modifying only except clauses, handler logging, or intent markers
        - run python -m py_compile on the modified file and report exact results
        - run focused pytest tests for the package or script and report exact results
        - run gaia steward scan to prove the finding count for the subject file is reduced
        - for a narrowed handler, run a focused test that raises the expected error through the try and shows it is still handled, and report exact results
        - obtain independent review before integration
    credential-review-disposition:
      debtKind: credential_review
      authority: B
      routine: credential-review
      promptGuide: founder/steward/routines/credential-review.md
      capability: >-
        Read one flagged line and its callers, decide from the evidence whether the matched value is a
        live credential, a synthetic fixture, a mirror of a reviewed source, a harmless pattern or runtime
        header construction, and state that evidence precisely enough for an independent reviewer to
        reproduce it. Never guess: anything that could be live is escalated, not dispositioned.
      objective: >-
        For the one subject file, draft one disposition record per undecided finding with
        scripts/steward_credential_disposition.py, fill in the policy, disposition, evidence and author, and
        leave verifiedBy, verifiedAt and verificationReceipt empty. An independent verifier reproduces the
        evidence; the lead's integrate step records that verification as a receipt and stamps the record.
        Edit no source file, rotate nothing, and do not touch the policy, decisions or receipts.
      allowedPaths:
        - founder/steward/security-dispositions/**
      allowedCommands:
        - python scripts/steward_credential_disposition.py draft <debt id> --write
        - python scripts/check_security_dispositions.py
        - python -m pytest tests/steward/test_credential_dispositions.py
        - gaia steward scan
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - founder/**
        # Verification receipts are written only by the lead's integrate step. This
        # nested ban overrides the allowed parent, so a builder cannot self-verify.
        - founder/steward/security-dispositions/receipts/**
        - registry/**
        - skill-trees/**
        - docs/**
        - scripts/**
        - src/**
        - tests/**
      stopConditions:
        - the finding looks like a live credential, or its provenance is ambiguous or unknown
        - the diff touches any path outside founder/steward/security-dispositions/
        - any source, test, workflow, policy or decision file would need to change
        - a record would carry verifiedBy, verifiedAt or verificationReceipt, or any receipt would be written
        - the matched line or token changed since the debt was observed
        - the finding does not reproduce on the current head
      proof:
        - reproduce every undecided finding for the subject file from the current head
        - show a diff confined to founder/steward/security-dispositions/
        - cite specific evidence for each record (the line, the callers, the source of the value)
        - show that verifiedBy, verifiedAt and verificationReceipt are empty so an independent verifier must sign
        - obtain independent review before integration
    knowledge-contradiction:
      debtKind: knowledge_contradiction
      authority: B
      routine: knowledge-contradiction
      promptGuide: founder/steward/routines/knowledge-contradiction.md
      capability: >-
        Compare bounded authoritative documents, establish which source governs the fact, and
        distinguish a correctable stale statement from history or an unsettled product decision.
      objective: >-
        Reproduce one exact contradiction in the permitted agent-document surface and return the
        smallest reviewable proposal. Stop when source precedence or semantic meaning is disputed.
      allowedPaths:
        - docs/agents/**
        - tests/steward/**
      allowedCommands:
        - git status --short
        - python -m pytest tests/steward/test_sensors.py
        - python -m pytest tests/steward/test_repository_hygiene.py
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/graph/**
        - founder/**
        - registry/**
        - registry/schema/**
        - skill-trees/**
        - src/**
      stopConditions:
        - semantic meaning, product policy, or source precedence is ambiguous
        - the apparent disagreement is historical, archived, or describes a past state
        - the correction requires a canonical skill, root, founder, registry, Class S, or source edit
        - a correction would widen authority or weaken any hard floor
        - focused validation or independent review is incomplete
      proof:
        - reproduce the exact incompatible statements and establish their authoritative source
        - show a diff confined to docs/agents/** and tests/steward/**
        - run the applicable focused read-only checks and report exact results
        - obtain independent review before integration
    issue-suite-review:
      debtKind: issue_suite_review
      authority: B
      routine: issue-hygiene
      promptGuide: founder/steward/routines/issue-hygiene.md
      capability: >-
        Careful reading of one batch of related GitHub issues against the registry
        records they claim to duplicate, superseded or curated, distinguishing a
        provably preserved payload from a similar title, and expressing each
        disposition as a reviewable proposal rather than an action.
      objective: >-
        Review exactly one suite batch named by the packet, check every row against
        its registry evidence, and return a disposition proposal file that marks each
        item as proven, needing curation, or a founder question. Closing issues and
        accepting candidates are never part of this work.
      allowedPaths:
        - docs/agents/issue-hygiene/**
        - tests/steward/**
      allowedCommands:
        - python -m pytest tests/steward/issuehygiene
        - python scripts/check_steward_coverage.py --check
        - gh issue view <number> --json number,title,state,labels,body
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/**
        - docs/graph/**
        - founder/**
        - registry/**
        - skill-trees/**
        - src/**
      stopConditions:
        - the packet names more than one suite batch
        - a row's registry evidence cannot be read from local repository state
        - a disposition would close an issue or accept a candidate
        - the correction requires a registry mutation outside gaia dev verbs
        - the payload preservation proof for a row is incomplete
      proof:
        - reproduce every disposition from the census and local registry state
        - show a diff confined to docs/agents/issue-hygiene and tests/steward
        - run the focused issue-hygiene tests and report exact results
        - obtain independent review before integration
    workflow-timeout-repair:
      debtKind: workflow_hygiene
      authority: B
      routine: ci-architecture-steward
      promptGuide: founder/steward/routines/workflow-timeout.md
      capability: >-
        Read a GitHub Actions job to understand what it does and where it can legitimately wait,
        weigh that against observed historical run durations, and choose a per-job timeout that
        kills a hung job without killing a healthy slow one. Express the repair as the addition of
        timeout-minutes lines and nothing else, in a security-relevant file.
      objective: >-
        For one workflow file with missing-timeout findings, add a job-level timeout-minutes to each
        flagged job, with the value chosen from the job's semantics and its historical durations, and
        return the smallest diff with the reasoning for every value. Founder ruling #14 (decision
        steward-workflow-timeout-route, #2283) grants exactly this and no other workflow write. A
        missing timeout is a configuration finding, not evidence that the job ever timed out.
      # The ONE exception to the .github/** floor. policy.py pins the allowed path
      # exactly and refuses it for any other debt kind; the exclusions below are
      # required, not advisory. gh-aw generated lock files are compiled output.
      allowedPaths:
        - .github/workflows/*.yml
      allowedCommands:
        - python scripts/check_steward_coverage.py --check
        - python -m pytest tests/steward/test_sensors_ci.py
        - python -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" <workflow-file>
        - gh run list --workflow <workflow-file> --status completed --limit 50 --json databaseId,conclusion,createdAt,startedAt,updatedAt
        - gh api repos/gaia-research/gaia-skill-tree/actions/runs/<run-id>/jobs --jq '.jobs[] | {name, conclusion, started_at, completed_at}'
        - python -m gaia_cli.steward.workflowproof history --history <job-history.json>
        - python -m gaia_cli.steward.workflowproof no-history --class <class> --declared-wait-seconds <seconds> --history <job-history.json>
      forbiddenPaths:
        - .agents/skills/**
        - .claude/skills/**
        - .gaia/steward/**
        - .github/actions/**
        - .github/workflows/*.lock.yml
        - .github/workflows/_disabled/**
        - .github/workflows/shared/**
        - docs/**
        - founder/**
        - registry/**
        - skill-trees/**
        - src/**
        - tests/**
      stopConditions:
        - the finding does not reproduce on the current head
        - the subject is a gh-aw generated lock file or has a gh-aw source beside it; fix the source and recompile is a founder-gated step
        - any change other than adding a job-level timeout-minutes line would be needed, or the debt carries any finding other than missing-timeout
        - completed-run duration history cannot be read for a flagged job; or it was read, shows no successful run, and the no-history default (decision steward-workflow-timeout-no-history-2283) does not apply
        - the no-history default would exceed 60 minutes, the job has an unbounded wait, or its steps fit none of the three classes
        - the job legitimately waits on a human, an environment approval or an external deploy and no bound is justifiable
        - a wait runs gh run watch or gh workflow run, is unbounded, depends on a value not written in this job's YAML (env and matrix bounds resolve to their worst case or stop), or sits in a composite or third-party action whose waits cannot be read and bounded
        - a flagged job is a reusable-workflow call, which cannot declare timeout-minutes
        - the workflow file does not parse as YAML after the edit
        - validation, coverage, or independent proof is incomplete
      proof:
        - reproduce every missing-timeout finding for the subject workflow on the current head
        - for each job, state its semantics, the sampled completed-run durations, and the timeout chosen with the rule applied, with the job's raw history rows file and the matching python -m gaia_cli.steward.workflowproof history or no-history --history command and its exact output (selection and value; no-history jobs also state class and resolved declared waits)
        - show a diff confined to the one workflow file that only adds integer 1..360 timeout-minutes keys directly under existing jobs that lacked them
        - parse the edited workflow as YAML and report exact results
        - run python scripts/check_steward_coverage.py --check and the focused CI sensor tests and report exact results
        - obtain independent review before integration
  founderRules:
    issue-founder-decision:
      debtKind: issue_founder_decision
      authority: C
      decisionTargetField: decisionTarget
      objective: >-
        Decide one exact issue-hygiene question shared by the affected issues, such as
        whether a family of upstream candidates is accepted, rejected or deferred.
    routine-pr-founder-decision:
      debtKind: routine_pr_founder_decision
      authority: C
      decisionTargetField: decisionTarget
      objective: >-
        Decide one exact routine pull request that Steward cannot legitimately decide: an explicit founder hold, a
        draft, a missing required approval, a design gate, or a destructive closure. Steward never merges or closes it.
    generic-mapping-decision:
      debtKind: generic_mapping
      authority: C
      decisionTargetField: decisionTarget
      objective: Decide the canonical generic mapping for the explicit normalized target.

# Issue hygiene (#2130). Policy may narrow this section; code caps and rule ids are pinned in
# src/gaia_cli/steward/issuehygiene/hygienepolicy.py. Absent section => no closure authority.
issueHygiene:
  maxClosuresPerRun: 10
  maxCensusAgeSeconds: 21600
  closedWindowDays: 30
  # The A1-A5 allowlist below is FOUNDER-RATIFIED policy (ruling #10, 2026-11-06, recorded verbatim in
  # founder/steward/decisions/steward-issue-closure-authority.json, resolution: approved). Ratification is the authority;
  # it is not an operational rollout. Closures need an attributable Steward owner and worker on every receipt, exact
  # proof and before/after state; a reopened issue is respected and never re-closed; ambiguous, contested or
  # unsupported cases are excluded.
  # writesEnabled stays false: rollout waits for independent verification with the existing write switches and gates
  # explicitly satisfied. A switch edit alone never authorizes closures (the approved record is required too), and the
  # approved record alone never turns writes on. No live closure dry run or pilot is authorized by this ratification.
  writesEnabled: false
  enabledRules:
    - A1-child-curated
    - A2-umbrella-synced
    - A3-umbrella-superseded
    - A4-duplicate-child
    - A5-botreport-superseded
  # Workflow files whose disabled state proves a bot family is no longer running (A5).
  # Empty = A5 can never be proven, so it stays Class B/C.
  a5Disabled: []

# Routine pull-request stewardship (routine 19). Producer registry: founder/steward/pr-producers.json.
# Like issue hygiene, this is a ratified route: founder/steward/decisions/steward-pr-maintenance-authority.json
# is decided and approved (and its writes are already on, unlike issueHygiene.writesEnabled). A switch edit alone never grants it, and the record alone never exceeds these ceilings.
# Squash is not representable. Merges go through forge.merge_pr only: exact head SHA, independent verification,
# GitHub's own branch protection. Steward never pushes to a protected branch.
prMaintenance:
  writesEnabled: true
  killSwitch: false
  maxCensusAgeSeconds: 3600
  maxMergesPerRun: 2
  maxClosuresPerRun: 2
  maxCommentsPerRun: 30
  hourlyWriteCap: 10
  verificationTtlSeconds: 21600
  maxReplacementsPerRun: 2
  enabledActions:
    - comment
    - merge
    - close
  destinations:
    - main
  mergeMethods:
    - merge

# Browser access for rendered-frontend observation (routine 15; founder ruling steward-browser-render-driver).
# Headless Chromium is free and on by default for scheduled and founder runs. A real, interactive browser is
# never a persistent setting: only `gaia steward full run --interactive-browser` authorizes it, for that run.
browser:
  headless: true
