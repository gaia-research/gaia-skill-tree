skills:
  - id: reference-guided-visual-iteration
    name: Reference-Guided Visual Iteration
    type: fusion
    prerequisites: [code-generation, vision-qa, evaluate-output]
    description: >-
      Builds code-rendered visual work (3D scenes, video, games, UI) by repeatedly rendering stills, comparing them side by side with supplied reference images or video against a numeric per-dimension quality bar, scoring with independent fresh-context critics, and fixing the weakest dimension until the bar is met.
