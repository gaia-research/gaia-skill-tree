<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Before and after Trust Magnitude evidence flow</title>
  <desc id="desc">A side-by-side comparison. Before Yggdrasil III, shared repository evidence and fusion structure both flowed into component Trust Magnitude. After Yggdrasil III, shared suite evidence is capped at 50 TM per component, fusion structure contributes zero TM while remaining visible, and component-specific evidence stays eligible.</desc>
  <defs>
    <marker id="arrowBefore" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#9f1239"/></marker>
    <marker id="arrowAfter" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#166534"/></marker>
    <marker id="arrowStructure" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6b7280"/></marker>
    <style>
      .bg{fill:#fff}.panel{fill:#fafaf9;stroke:#d6d3d1;stroke-width:2}.heading{font:700 22px Arial,sans-serif;fill:#111827}.sub{font:400 14px Arial,sans-serif;fill:#57534e}.box{fill:#fff;stroke:#78716c;stroke-width:2}.before{fill:#fff1f2;stroke:#be123c}.after{fill:#f0fdf4;stroke:#15803d}.structure{fill:#f5f5f4;stroke:#78716c;stroke-dasharray:7 6}.label{font:700 15px Arial,sans-serif;fill:#1c1917}.small{font:400 13px Arial,sans-serif;fill:#44403c}.value{font:700 17px Arial,sans-serif}.beforeText{fill:#9f1239}.afterText{fill:#166534}.lineBefore{stroke:#9f1239;stroke-width:3;fill:none;marker-end:url(#arrowBefore)}.lineAfter{stroke:#166534;stroke-width:3;fill:none;marker-end:url(#arrowAfter)}.lineStructure{stroke:#6b7280;stroke-width:2.5;stroke-dasharray:7 6;fill:none;marker-end:url(#arrowStructure)}
    </style>
  </defs>
  <rect class="bg" width="920" height="500" rx="16"/>
  <rect class="panel" x="20" y="20" width="425" height="460" rx="16"/>
  <rect class="panel" x="475" y="20" width="425" height="460" rx="16"/>

  <text class="heading" x="48" y="60">Before</text>
  <text class="sub" x="48" y="84">Shared context could look like extra corroboration.</text>
  <rect class="box before" x="48" y="115" width="165" height="74" rx="10"/>
  <text class="label" x="130" y="142" text-anchor="middle">Suite repository</text>
  <text class="small" x="130" y="165" text-anchor="middle">shared stars + repo</text>
  <rect class="box before" x="48" y="235" width="165" height="74" rx="10"/>
  <text class="label" x="130" y="262" text-anchor="middle">Fusion recipe</text>
  <text class="small" x="130" y="285" text-anchor="middle">suite structure</text>
  <path class="lineBefore" d="M213 152 H290 V200"/>
  <path class="lineBefore" d="M213 272 H290 V224"/>
  <rect class="box before" x="290" y="167" width="125" height="92" rx="12"/>
  <text class="label" x="352" y="196" text-anchor="middle">Component</text>
  <text class="value beforeText" x="352" y="222" text-anchor="middle">TM rises</text>
  <text class="small" x="352" y="244" text-anchor="middle">from both</text>
  <rect class="box" x="48" y="355" width="367" height="82" rx="10"/>
  <text class="label" x="68" y="385">Problem</text>
  <text class="small" x="68" y="409">One shared signal and structural metadata could</text>
  <text class="small" x="68" y="429">appear as repeated, independent-looking support.</text>

  <text class="heading" x="503" y="60">Yggdrasil III</text>
  <text class="sub" x="503" y="84">Shared context is bounded; specific evidence still counts.</text>
  <rect class="box after" x="503" y="105" width="177" height="82" rx="10"/>
  <text class="label" x="591" y="132" text-anchor="middle">Suite repository</text>
  <text class="value afterText" x="591" y="157" text-anchor="middle">≤ 50 TM</text>
  <text class="small" x="591" y="177" text-anchor="middle">per component</text>
  <rect class="box structure" x="503" y="224" width="177" height="82" rx="10"/>
  <text class="label" x="591" y="251" text-anchor="middle">Fusion recipe</text>
  <text class="value" x="591" y="276" text-anchor="middle" fill="#57534e">0 TM</text>
  <text class="small" x="591" y="296" text-anchor="middle">structure stays visible</text>
  <rect class="box after" x="503" y="343" width="177" height="82" rx="10"/>
  <text class="label" x="591" y="370" text-anchor="middle">Specific evidence</text>
  <text class="value afterText" x="591" y="395" text-anchor="middle">Eligible</text>
  <text class="small" x="591" y="415" text-anchor="middle">under normal rules</text>
  <path class="lineAfter" d="M680 146 H741 V210"/>
  <path class="lineStructure" d="M680 265 H741"/>
  <path class="lineAfter" d="M680 384 H741 V258"/>
  <rect class="box after" x="741" y="184" width="129" height="100" rx="12"/>
  <text class="label" x="805" y="214" text-anchor="middle">Component</text>
  <text class="value afterText" x="805" y="240" text-anchor="middle">TM</text>
  <text class="small" x="805" y="263" text-anchor="middle">evidence-based</text>
  <text class="small" x="805" y="331" text-anchor="middle">Dashed line = provenance,</text>
  <text class="small" x="805" y="351" text-anchor="middle">not a TM contribution.</text>
</svg>
