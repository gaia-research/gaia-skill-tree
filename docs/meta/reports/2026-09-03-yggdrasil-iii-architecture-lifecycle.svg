<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Yggdrasil III Architecture Lifecycle — Four Phases</title>
  <desc id="desc">A comprehensive timeline diagram showing the four phases of Yggdrasil III: Phase 1 (Aug 25-29) structural separation of provenance from trust, Phase 2 (Sep 1-3) Fusion Score ratification and initial 63-skill recalibration, Phase 3 (Sep 3-4) forensic audit and imposter purge, and Phase 4 (Sep 4-5) logarithmic adoption curve and final 280-skill recalibration.</desc>
  <defs>
    <marker id="phaseArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#78716c"/></marker>
    <linearGradient id="timelineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="25%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="75%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .bg{fill:#ffffff}.phase-box{stroke-width:2;rx:12}.p1{fill:#eff6ff;stroke:#1e3a5f}.p2{fill:#f0fdf4;stroke:#166534}.p3{fill:#fff1f2;stroke:#9f1239}.p4{fill:#f5f3ff;stroke:#7c3aed}.heading{font:700 24px Arial,Helvetica,sans-serif;fill:#111827}.sub{font:500 12px Arial,Helvetica,sans-serif;fill:#4b5563}.phase-label{font:700 13px Arial,Helvetica,sans-serif;letter-spacing:0.08em}.p1-text{fill:#1e3a5f}.p2-text{fill:#166534}.p3-text{fill:#9f1239}.p4-text{fill:#7c3aed}.phase-title{font:600 15px Arial,Helvetica,sans-serif;fill:#111827}.detail{font:400 12px Arial,Helvetica,sans-serif;fill:#44403c}.detail-bold{font:600 12px Arial,Helvetica,sans-serif;fill:#1c1917}.date-label{font:600 11px 'Courier New',monospace;fill:#78716c;letter-spacing:0.03em}.timeline-bar{fill:url(#timelineGrad);rx:4}.issue-tag{font:600 10px Arial,Helvetica,sans-serif;fill:#6b7280}.metric{font:700 22px Arial,Helvetica,sans-serif}.metric-label{font:400 11px Arial,Helvetica,sans-serif;fill:#57534e}.connector{stroke:#78716c;stroke-width:1.5;stroke-dasharray:6 4;fill:none;marker-end:url(#phaseArrow)}
    </style>
  </defs>
  <rect class="bg" width="1100" height="620" rx="16"/>

  <!-- Title & Subtitle -->
  <text class="heading" x="550" y="28" text-anchor="middle">Yggdrasil III: Architecture Lifecycle &amp; Trust Rebalance</text>
  <text class="sub" x="550" y="46" text-anchor="middle">Why rebalanced: Purge artificial star inflation and unearned claims to restore merit-based rankings</text>

  <!-- Timeline bar -->
  <rect class="timeline-bar" x="60" y="68" width="980" height="6"/>
  <!-- Date markers -->
  <text class="date-label" x="60" y="63">AUG 25</text>
  <text class="date-label" x="280" y="63">AUG 29</text>
  <text class="date-label" x="490" y="63">SEP 1</text>
  <text class="date-label" x="690" y="63">SEP 3</text>
  <text class="date-label" x="870" y="63">SEP 4</text>
  <text class="date-label" x="1000" y="63">SEP 5</text>
  <!-- tick marks -->
  <line x1="60" y1="68" x2="60" y2="78" stroke="#78716c" stroke-width="2"/>
  <line x1="300" y1="68" x2="300" y2="78" stroke="#78716c" stroke-width="2"/>
  <line x1="510" y1="68" x2="510" y2="78" stroke="#78716c" stroke-width="2"/>
  <line x1="710" y1="68" x2="710" y2="78" stroke="#78716c" stroke-width="2"/>
  <line x1="890" y1="68" x2="890" y2="78" stroke="#78716c" stroke-width="2"/>
  <line x1="1040" y1="68" x2="1040" y2="78" stroke="#78716c" stroke-width="2"/>

  <!-- Phase 1 -->
  <rect class="phase-box p1" x="40" y="90" width="250" height="240"/>
  <text class="phase-label p1-text" x="165" y="116" text-anchor="middle">PHASE 1 — STRUCTURAL SEPARATION</text>
  <text class="phase-title" x="60" y="142">Provenance ≠ Trust</text>
  <text class="detail" x="60" y="164">• fusion-recipe → 0 TM</text>
  <text class="detail" x="60" y="182">• Suite component cap: ≤ 50 TM</text>
  <text class="detail" x="60" y="200">• Independent S witness required</text>
  <text class="detail" x="60" y="218">• Emergency star recalibration</text>
  <line x1="60" y1="232" x2="270" y2="232" stroke="#d6d3d1" stroke-width="1"/>
  <text class="issue-tag" x="60" y="250">Integrity Architecture Policy</text>
  <text class="issue-tag" x="60" y="266">Resolver role correction</text>
  <text class="issue-tag" x="60" y="282">Role-variant recalibration</text>
  <text class="issue-tag" x="60" y="298">Star formula recalibration</text>
  <text class="metric p1-text" x="165" y="322" text-anchor="middle">264</text>
  <text class="metric-label" x="165" y="338" text-anchor="middle">skills recalibrated</text>

  <!-- Connector 1→2 -->
  <path class="connector" d="M290 210 H320"/>

  <!-- Phase 2 -->
  <rect class="phase-box p2" x="320" y="90" width="250" height="240"/>
  <text class="phase-label p2-text" x="445" y="116" text-anchor="middle">PHASE 2 — FUSION SCORE RATIFICATION</text>
  <text class="phase-title" x="340" y="142">Structural Lane Ships</text>
  <text class="detail" x="340" y="164">• Fusion Score = structural reading</text>
  <text class="detail" x="340" y="182">• Hall of Heroes: +XX Fusion badge</text>
  <text class="detail" x="340" y="200">• Unique / Suite plates differentiated</text>
  <text class="detail" x="340" y="218">• 63-skill grade recalibration</text>
  <line x1="340" y1="232" x2="550" y2="232" stroke="#d6d3d1" stroke-width="1"/>
  <text class="issue-tag" x="340" y="250">Fusion Score specification</text>
  <text class="issue-tag" x="340" y="266">Hall of Heroes branch craft</text>
  <text class="issue-tag" x="340" y="282">Initial 63-skill recalibration</text>
  <text class="issue-tag" x="340" y="298">Legacy backlog resolution</text>
  <text class="metric p2-text" x="445" y="322" text-anchor="middle">9 → S</text>
  <text class="metric-label" x="445" y="338" text-anchor="middle">skills elevated to Grade S</text>

  <!-- Connector 2→3 -->
  <path class="connector" d="M570 210 H600"/>

  <!-- Phase 3 -->
  <rect class="phase-box p3" x="600" y="90" width="250" height="240"/>
  <text class="phase-label p3-text" x="725" y="116" text-anchor="middle">PHASE 3 — FORENSIC AUDIT</text>
  <text class="phase-title" x="620" y="142">Imposter Purge &amp; Ranks</text>
  <text class="detail" x="620" y="164">• 339 named skills audited</text>
  <text class="detail" x="620" y="182">• 12 non-skill entities expunged</text>
  <text class="detail" x="620" y="200">• 10 monorepo stubs demoted 4★→1★</text>
  <text class="detail" x="620" y="218">• 35 ungrounded citation rows stripped</text>
  <line x1="620" y1="232" x2="830" y2="232" stroke="#d6d3d1" stroke-width="1"/>
  <text class="issue-tag" x="620" y="250">Root suite boundary policy</text>
  <text class="issue-tag" x="620" y="266">98+ evidence rows stripped</text>
  <text class="issue-tag" x="620" y="282">Unreachable link demotions</text>
  <text class="issue-tag" x="620" y="298">Library &amp; SaaS purge</text>
  <text class="metric p3-text" x="725" y="322" text-anchor="middle">#1–#15</text>
  <text class="metric-label" x="725" y="338" text-anchor="middle">ranks restored to real skills</text>

  <!-- Connector 3→4 -->
  <path class="connector" d="M850 210 H880"/>

  <!-- Phase 4 -->
  <rect class="phase-box p4" x="880" y="90" width="200" height="240"/>
  <text class="phase-label p4-text" x="980" y="116" text-anchor="middle">PHASE 4 — LOGARITHMIC CURVE</text>
  <text class="phase-title" x="900" y="142">Diminishing Returns</text>
  <text class="detail" x="900" y="164">• 35 · log₁₀(stars/10)</text>
  <text class="detail" x="900" y="182">• Adoption cap: 175 TM</text>
  <text class="detail" x="900" y="200">• Preflight-reject awakened</text>
  <text class="detail" x="900" y="218">• TM Calculator shipped</text>
  <line x1="900" y1="232" x2="1060" y2="232" stroke="#d6d3d1" stroke-width="1"/>
  <text class="issue-tag" x="900" y="250">Logarithmic curve adoption</text>
  <text class="issue-tag" x="900" y="266">Public TM calculator launch</text>
  <text class="issue-tag" x="900" y="282">Awakened status gate</text>
  <text class="metric p4-text" x="980" y="322" text-anchor="middle">280</text>
  <text class="metric-label" x="980" y="338" text-anchor="middle">skills locked, 0 drift</text>

  <!-- Bottom summary row -->
  <rect fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" x="40" y="360" width="1040" height="250" rx="12"/>
  <text class="phase-title" x="60" y="388">Outcome Summary: Before → After Yggdrasil III</text>

  <!-- Before column -->
  <rect fill="#fff1f2" stroke="#fecdd3" stroke-width="1" x="60" y="400" width="480" height="95" rx="8"/>
  <text class="detail-bold" x="80" y="422">Before Yggdrasil III (Why Rebalance Was Required)</text>
  <text class="detail" x="80" y="442">• fusion-recipe inflated TM across all suite components</text>
  <text class="detail" x="80" y="458">• Linear star formula: unbounded adoption credit</text>
  <text class="detail" x="80" y="474">• Aggregator monorepos occupied leaderboard top-5 (ranks #2, #4, #5)</text>
  <text class="detail" x="80" y="490">• 35+ consortium paper citations counted as peer review</text>

  <!-- After column -->
  <rect fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" x="560" y="400" width="500" height="95" rx="8"/>
  <text class="detail-bold" x="580" y="422">After Yggdrasil III (What Changed &amp; Restored Ranks)</text>
  <text class="detail" x="580" y="442">• fusion-recipe = 0 TM; structural metadata only</text>
  <text class="detail" x="580" y="458">• Logarithmic curve: 175 TM cap at adoption layer</text>
  <text class="detail" x="580" y="474">• 12 imposters purged; legitimate skills hold ranks #1–#15</text>
  <text class="detail" x="580" y="490">• Verified Grade S evidence elevates authentic flagships</text>

  <!-- Governance invariants -->
  <text class="phase-title" x="60" y="524">Three Non-Negotiable Invariants</text>
  <rect fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" x="60" y="534" width="320" height="48" rx="8"/>
  <text class="detail-bold" x="80" y="554">① Agent Skills Only</text>
  <text class="detail" x="80" y="572">No papers, SaaS, or raw libraries</text>

  <rect fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" x="400" y="534" width="320" height="48" rx="8"/>
  <text class="detail-bold" x="420" y="554">② No Monorepo Laundering</text>
  <text class="detail" x="420" y="572">Stars cannot project onto stubs</text>

  <rect fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" x="740" y="534" width="320" height="48" rx="8"/>
  <text class="detail-bold" x="760" y="554">③ No S Without Witness</text>
  <text class="detail" x="760" y="572">175 TM cap; S needs external proof</text>
</svg>
