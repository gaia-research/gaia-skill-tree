<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Imposter Purge and Evidence Decontamination Flow</title>
  <desc id="desc">A flow diagram showing the forensic audit findings and remediation: K-Dense-AI monorepo splitting 41k stars across 10 template stubs demoted to 1 star, DeepMind consortium paper citations stripped, academic papers without code removed, SaaS products removed, and grounded 4-star evidence ingested for legitimate skills.</desc>
  <defs>
    <marker id="redArr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#dc2626"/></marker>
    <marker id="grnArr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#166534"/></marker>
    <marker id="gryArr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#78716c"/></marker>
    <style>
      .bg{fill:#fff}.heading{font:700 22px Arial,Helvetica,sans-serif;fill:#111827}.sub{font:400 13px Arial,Helvetica,sans-serif;fill:#57534e}.panel{rx:12;stroke-width:2}.audit-panel{fill:#fafaf9;stroke:#d6d3d1}.red-panel{fill:#fff1f2;stroke:#fecaca}.green-panel{fill:#f0fdf4;stroke:#bbf7d0}.box{stroke-width:1.5;rx:8}.red-box{fill:#fef2f2;stroke:#dc2626}.orange-box{fill:#fff7ed;stroke:#ea580c}.yellow-box{fill:#fefce8;stroke:#ca8a04}.green-box{fill:#f0fdf4;stroke:#15803d}.gray-box{fill:#f5f5f5;stroke:#9ca3af}.label{font:700 12px Arial,Helvetica,sans-serif;fill:#1c1917}.small{font:400 11px Arial,Helvetica,sans-serif;fill:#44403c}.small-bold{font:600 11px Arial,Helvetica,sans-serif;fill:#1c1917}.value{font:700 14px Arial,Helvetica,sans-serif}.red-text{fill:#dc2626}.orange-text{fill:#ea580c}.green-text{fill:#166534}.count{font:700 24px Arial,Helvetica,sans-serif}.strike{text-decoration:line-through;fill:#9ca3af}.section-label{font:700 11px Arial,Helvetica,sans-serif;letter-spacing:0.08em}.line-red{stroke:#dc2626;stroke-width:2;fill:none;marker-end:url(#redArr)}.line-green{stroke:#166534;stroke-width:2;fill:none;marker-end:url(#grnArr)}.line-gray{stroke:#78716c;stroke-width:1.5;fill:none;marker-end:url(#gryArr)}
    </style>
  </defs>
  <rect class="bg" width="960" height="600" rx="16"/>

  <!-- Title & Subtitle -->
  <text class="heading" x="480" y="30" text-anchor="middle">Forensic Audit: Imposter Purge &amp; Rank Restoration</text>
  <text class="sub" x="480" y="52" text-anchor="middle">Why rebalanced: Monorepo stubs and invalid entities seized top ranks — 12 expunged, real skills restored to #1–#15</text>

  <!-- SECTION 1: K-Dense Monorepo -->
  <rect class="panel audit-panel" x="20" y="72" width="440" height="248"/>
  <text class="section-label red-text" x="40" y="94">IMPOSTER AGGREGATOR — K-DENSE-AI</text>

  <!-- Monorepo source -->
  <rect class="box red-box" x="40" y="106" width="180" height="60"/>
  <text class="label" x="130" y="126" text-anchor="middle">K-Dense-AI Monorepo</text>
  <text class="value red-text" x="130" y="148" text-anchor="middle">41,201 ★</text>

  <!-- Arrow: fans out to stubs -->
  <path class="line-red" d="M220 136 H270"/>

  <!-- Template stubs -->
  <rect class="box red-box" x="270" y="100" width="170" height="120"/>
  <text class="label" x="355" y="118" text-anchor="middle">10 Template Stubs</text>
  <text class="small" x="285" y="138">transformers</text>
  <text class="small" x="285" y="154">pytorch-lightning</text>
  <text class="small" x="285" y="170">qiskit, rdkit, scanpy</text>
  <text class="small" x="285" y="186">stable-baselines3</text>
  <text class="small" x="285" y="202">scvi-tools, deepchem...</text>
  <text class="small" x="285" y="218" style="fill:#dc2626;font-weight:600">Each claimed 41k ★</text>

  <!-- Result -->
  <rect class="box gray-box" x="40" y="240" width="400" height="65"/>
  <text class="small-bold" x="60" y="260">Remediation &amp; Rank Impact:</text>
  <text class="small" x="60" y="278">• All 10 stubs stripped of monorepo stars → demoted to 1★</text>
  <text class="small" x="60" y="296">• Vacated false ranks #2, #4, #5, #18; returned to genuine skills</text>

  <!-- SECTION 2: Evidence Decontamination -->
  <rect class="panel audit-panel" x="500" y="72" width="440" height="248"/>
  <text class="section-label orange-text" x="520" y="94">EVIDENCE LAKE DECONTAMINATION</text>

  <!-- DeepMind citations -->
  <rect class="box orange-box" x="520" y="106" width="195" height="72"/>
  <text class="label" x="617" y="126" text-anchor="middle">DeepMind Consortium</text>
  <text class="value orange-text" x="617" y="148" text-anchor="middle">35 rows stripped</text>
  <text class="small" x="617" y="166" text-anchor="middle">Ungrounded paper citations</text>

  <!-- Hijacked citations -->
  <rect class="box orange-box" x="735" y="106" width="185" height="72"/>
  <text class="label" x="827" y="126" text-anchor="middle">Hijacked Citations</text>
  <text class="small" x="827" y="148" text-anchor="middle">Princeton ToolMaker</text>
  <text class="small" x="827" y="166" text-anchor="middle">Misattributed paper rows</text>

  <!-- Firecrawl stars -->
  <rect class="box orange-box" x="520" y="190" width="195" height="58"/>
  <text class="label" x="617" y="210" text-anchor="middle">Firecrawl Engine Stars</text>
  <text class="small" x="617" y="228" text-anchor="middle">176k ★ stripped (skill had 98★)</text>

  <!-- uv stars -->
  <rect class="box orange-box" x="735" y="190" width="185" height="58"/>
  <text class="label" x="827" y="210" text-anchor="middle">Astral uv Attribution</text>
  <text class="small" x="827" y="228" text-anchor="middle">51k ★ stripped (external project)</text>

  <!-- Decontamination result -->
  <rect class="box gray-box" x="520" y="258" width="400" height="52"/>
  <text class="count orange-text" x="540" y="287">98+</text>
  <text class="small-bold" x="596" y="282">contaminated evidence rows removed</text>
  <text class="small" x="596" y="298">across consortium papers, misattributed citations, engine stars</text>

  <!-- SECTION 3: Non-Skill Purge -->
  <rect class="panel red-panel" x="20" y="340" width="440" height="244"/>
  <text class="section-label red-text" x="40" y="362">NON-SKILL ENTITIES EXPUNGED</text>

  <!-- Categories -->
  <rect class="box red-box" x="40" y="374" width="200" height="50"/>
  <text class="label" x="140" y="394" text-anchor="middle">Academic Papers (no code)</text>
  <text class="small" x="140" y="414" text-anchor="middle">few-shot-learning, self-consistency</text>

  <rect class="box red-box" x="250" y="374" width="190" height="50"/>
  <text class="label" x="345" y="394" text-anchor="middle">Commercial SaaS</text>
  <text class="small" x="345" y="414" text-anchor="middle">Devin AI (cognition-labs 404)</text>

  <rect class="box red-box" x="40" y="434" width="200" height="50"/>
  <text class="label" x="140" y="454" text-anchor="middle">Software Libraries</text>
  <text class="small" x="140" y="474" text-anchor="middle">DSPy (pip install dspy-ai)</text>

  <rect class="box red-box" x="250" y="434" width="190" height="50"/>
  <text class="label" x="345" y="454" text-anchor="middle">Phantom / Circular</text>
  <text class="small" x="345" y="474" text-anchor="middle">yundu-ai 404, self-fork</text>

  <!-- Total -->
  <rect fill="#fef2f2" stroke="#dc2626" stroke-width="2" x="40" y="500" width="400" height="68" rx="10"/>
  <text class="count red-text" x="240" y="530" text-anchor="middle">12</text>
  <text class="label" x="240" y="552" text-anchor="middle" style="fill:#dc2626">non-skill entities permanently removed from registry</text>

  <!-- SECTION 4: Clean Evidence Ingestion -->
  <rect class="panel green-panel" x="500" y="340" width="440" height="244"/>
  <text class="section-label green-text" x="520" y="362">GROUNDED EVIDENCE INGESTED</text>

  <!-- Verified skills -->
  <rect class="box green-box" x="520" y="376" width="200" height="96"/>
  <text class="label" x="620" y="396" text-anchor="middle">Restored Ranks #1–#4 (4★)</text>
  <text class="small" x="535" y="416">#1 ponytail · 124k ★</text>
  <text class="small" x="535" y="434">#2 taste-skill · 84k ★</text>
  <text class="small" x="535" y="452">#3 gsd · 64k ★</text>
  <text class="small" x="535" y="470">#4 last30days · 61k ★</text>

  <rect class="box green-box" x="740" y="376" width="180" height="96"/>
  <text class="label" x="830" y="396" text-anchor="middle">Verified Evidence</text>
  <text class="small" x="755" y="416">✓ Verified video demos</text>
  <text class="small" x="755" y="434">✓ Active code contributions</text>
  <text class="small" x="755" y="452">✓ Social engagement</text>
  <text class="small" x="755" y="470">✓ Verified adoption metrics</text>

  <!-- Clean result -->
  <rect fill="#f0fdf4" stroke="#166534" stroke-width="2" x="520" y="490" width="400" height="78" rx="10"/>
  <text class="count green-text" x="720" y="520" text-anchor="middle">22</text>
  <text class="label" x="720" y="542" text-anchor="middle" style="fill:#166534">verified evidence rows across 4 partitions</text>
  <text class="small" x="720" y="560" text-anchor="middle">Clean leaderboard: genuine skills hold ranks #1–#15</text>

  <!-- Root suite policy callout -->
  <rect fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" x="180" y="570" width="600" height="24" rx="6"/>
  <text x="480" y="587" text-anchor="middle" style="font:600 11px Arial,Helvetica,sans-serif;fill:#92400e">Root suite boundary policy prevents sub-suite cap evasion (garrytan, mattpocock, addy-osmani, ruvnet, firecrawl)</text>
</svg>
