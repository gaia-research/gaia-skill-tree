<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Suite and unique-skill Trust Magnitude balance</title>
  <desc id="desc">The suite side shows one shared repository feeding three components, with each shared baseline capped at 50 Trust Magnitude. Separate component-specific evidence feeds each component normally. Fusion-recipe links connect the components structurally but add zero Trust Magnitude. The unique-skill side shows eligible evidence feeding one unique skill under the same normal scoring rules.</desc>
  <defs>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#166534"/></marker>
    <marker id="grayArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6b7280"/></marker>
    <style>
      .bg{fill:#fff}.panel{fill:#fafaf9;stroke:#d6d3d1;stroke-width:2}.heading{font:700 22px Arial,sans-serif;fill:#111827}.sub{font:400 14px Arial,sans-serif;fill:#57534e}.box{fill:#fff;stroke:#78716c;stroke-width:2}.shared{fill:#fff7ed;stroke:#c2410c}.eligible{fill:#f0fdf4;stroke:#15803d}.struct{fill:#f5f5f4;stroke:#78716c;stroke-dasharray:7 6}.label{font:700 14px Arial,sans-serif;fill:#1c1917}.small{font:400 12.5px Arial,sans-serif;fill:#44403c}.value{font:700 16px Arial,sans-serif;fill:#166534}.sharedText{fill:#9a3412}.line{stroke:#166534;stroke-width:2.5;fill:none;marker-end:url(#greenArrow)}.sharedLine{stroke:#c2410c;stroke-width:2.5;fill:none;marker-end:url(#grayArrow)}.dash{stroke:#6b7280;stroke-width:2;stroke-dasharray:7 6;fill:none}
    </style>
  </defs>
  <rect class="bg" width="920" height="500" rx="16"/>
  <rect class="panel" x="20" y="20" width="590" height="460" rx="16"/>
  <rect class="panel" x="640" y="20" width="260" height="460" rx="16"/>

  <text class="heading" x="48" y="58">Suite components</text>
  <text class="sub" x="48" y="82">Shared standing is a baseline, not three new proofs.</text>
  <rect class="box shared" x="175" y="108" width="280" height="70" rx="11"/>
  <text class="label" x="315" y="136" text-anchor="middle">One shared suite repository</text>
  <text class="small" x="315" y="158" text-anchor="middle">repo-own + github-stars-own</text>

  <path class="sharedLine" d="M240 178 V222 H125 V258"/>
  <path class="sharedLine" d="M315 178 V258"/>
  <path class="sharedLine" d="M390 178 V222 H505 V258"/>

  <rect class="box eligible" x="48" y="258" width="155" height="88" rx="10"/>
  <text class="label" x="125" y="283" text-anchor="middle">Component A</text>
  <text class="value" x="125" y="308" text-anchor="middle">shared ≤ 50 TM</text>
  <text class="small" x="125" y="331" text-anchor="middle">+ specific evidence</text>
  <rect class="box eligible" x="238" y="258" width="155" height="88" rx="10"/>
  <text class="label" x="315" y="283" text-anchor="middle">Component B</text>
  <text class="value" x="315" y="308" text-anchor="middle">shared ≤ 50 TM</text>
  <text class="small" x="315" y="331" text-anchor="middle">+ specific evidence</text>
  <rect class="box eligible" x="428" y="258" width="155" height="88" rx="10"/>
  <text class="label" x="505" y="283" text-anchor="middle">Component C</text>
  <text class="value" x="505" y="308" text-anchor="middle">shared ≤ 50 TM</text>
  <text class="small" x="505" y="331" text-anchor="middle">+ specific evidence</text>

  <rect class="box eligible" x="48" y="390" width="155" height="54" rx="9"/>
  <text class="small" x="125" y="414" text-anchor="middle">A-specific evidence</text>
  <text class="value" x="125" y="434" text-anchor="middle">eligible</text>
  <rect class="box eligible" x="238" y="390" width="155" height="54" rx="9"/>
  <text class="small" x="315" y="414" text-anchor="middle">B-specific evidence</text>
  <text class="value" x="315" y="434" text-anchor="middle">eligible</text>
  <rect class="box eligible" x="428" y="390" width="155" height="54" rx="9"/>
  <text class="small" x="505" y="414" text-anchor="middle">C-specific evidence</text>
  <text class="value" x="505" y="434" text-anchor="middle">eligible</text>
  <path class="line" d="M125 390 V348"/>
  <path class="line" d="M315 390 V348"/>
  <path class="line" d="M505 390 V348"/>
  <path class="dash" d="M203 365 H428"/>
  <rect class="box struct" x="233" y="350" width="165" height="32" rx="8"/>
  <text class="small" x="315" y="371" text-anchor="middle">fusion recipe = 0 TM</text>

  <text class="heading" x="668" y="58">Unique skill</text>
  <text class="sub" x="668" y="82">Its own eligible evidence scores normally.</text>
  <rect class="box eligible" x="674" y="130" width="192" height="80" rx="10"/>
  <text class="label" x="770" y="159" text-anchor="middle">Eligible evidence</text>
  <text class="small" x="770" y="183" text-anchor="middle">specific to this skill</text>
  <path class="line" d="M770 210 V278"/>
  <rect class="box eligible" x="674" y="278" width="192" height="100" rx="12"/>
  <text class="label" x="770" y="309" text-anchor="middle">Unique skill</text>
  <text class="value" x="770" y="337" text-anchor="middle">TM from evidence</text>
  <text class="small" x="770" y="360" text-anchor="middle">same scoring rules</text>
  <text class="small" x="770" y="424" text-anchor="middle">No suite penalty.</text>
  <text class="small" x="770" y="445" text-anchor="middle">No repeated shared signal.</text>
</svg>
