name: Upstream Watcher

on:
  workflow_dispatch:
    inputs:
      permission_ab:
        description: "DIAGNOSTIC ONLY: paired permission A/B; skips ALL ordinary jobs regardless of other inputs"
        type: boolean
        default: false
      metadata_probe:
        description: "DIAGNOSTIC ONLY: read typed backlog metadata; skips all watcher jobs"
        type: boolean
        default: false
      skill_id:
        description: "Optional: single skill to poll (default = all suites)"
        required: false
        default: ""
      apply:
        description: "Actually create issues (default: dry-run)"
        type: boolean
        default: false
      challenge_watch:
        description: "Enable two-sided challenge watch (opt-in / configured)"
        type: boolean
        default: false
      challenge_input:
        description: "Optional path to active challenges input file"
        required: false
        default: ""
      challenge_shadow:
        description: "Allow unverified challenges in shadow mode"
        type: boolean
        default: false
      child_mode:
        description: "Emission contract (batch is staged; scheduled runs stay fanout)"
        type: choice
        options: [fanout, batch]
        default: fanout
      staging:
        description: "Staged weekly batching (#2283, ruling #12). inherit = follow repo variable UPSTREAM_BATCH_STAGING (unset = off). weekly requires child_mode=batch."
        type: choice
        options: [inherit, "off", weekly]
        default: inherit
      staging_bootstrap:
        description: "First staged run only: allow a missing pending-observation journal (never a corrupt one). Dispatch only; the schedule never bootstraps."
        type: boolean
        default: false
      escalate_candidate:
        description: "Optional: create ONE intake child for this batch row, e.g. garrytan/gbrain:foo (uses the apply flag). Skips polling."
        required: false
        default: ""

concurrency: upstream-weekly-census-readonly

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  weekly-census-readonly:
    name: P2 Hosted Read-Only Weekly Census
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.repository == 'gaia-research/gaia-skill-tree'
      && github.ref == 'refs/heads/census/p2-hosted-readonly-2026-11'
      && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
      && github.run_attempt == 1
      && inputs.apply == false
      && inputs.child_mode == 'batch'
      && inputs.staging == 'off'
      && (inputs.staging_bootstrap == false || inputs.staging_bootstrap == null || inputs.staging_bootstrap == '')
      && (inputs.challenge_watch == false || inputs.challenge_watch == null || inputs.challenge_watch == '')
      && (inputs.challenge_shadow == false || inputs.challenge_shadow == null || inputs.challenge_shadow == '')
      && (inputs.permission_ab == false || inputs.permission_ab == null || inputs.permission_ab == '')
      && (inputs.metadata_probe == false || inputs.metadata_probe == null || inputs.metadata_probe == '')
      && (inputs.escalate_candidate == '' || inputs.escalate_candidate == null)
      && (inputs.skill_id == '' || inputs.skill_id == null)
      && (inputs.challenge_input == '' || inputs.challenge_input == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout quarantined ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify dispatch contract and fetch pinned historical commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IN_APPLY: ${{ inputs.apply }}
          IN_CHILD_MODE: ${{ inputs.child_mode }}
          IN_STAGING: ${{ inputs.staging }}
          IN_STAGING_BOOTSTRAP: ${{ inputs.staging_bootstrap }}
          IN_CHALLENGE_WATCH: ${{ inputs.challenge_watch }}
          IN_CHALLENGE_SHADOW: ${{ inputs.challenge_shadow }}
          IN_PERMISSION_AB: ${{ inputs.permission_ab }}
          IN_METADATA_PROBE: ${{ inputs.metadata_probe }}
          IN_ESCALATE: ${{ inputs.escalate_candidate }}
          IN_SKILL_ID: ${{ inputs.skill_id }}
          IN_CHALLENGE_INPUT: ${{ inputs.challenge_input }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$REPO" = "gaia-research/gaia-skill-tree"
          test "$REF" = "refs/heads/census/p2-hosted-readonly-2026-11"
          test "$REF" != "refs/heads/${DEFAULT_BRANCH}"
          test "$RUN_ATTEMPT" = "1"
          test "$WORKFLOW_REF" = "gaia-research/gaia-skill-tree/.github/workflows/upstream-watcher.yml@refs/heads/census/p2-hosted-readonly-2026-11"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$EVENT_SHA"
          test "$IN_APPLY" = "false"
          test "$IN_CHILD_MODE" = "batch"
          test "$IN_STAGING" = "off"
          for switch_val in "$IN_STAGING_BOOTSTRAP" "$IN_CHALLENGE_WATCH" "$IN_CHALLENGE_SHADOW" "$IN_PERMISSION_AB" "$IN_METADATA_PROBE"; do
            case "$switch_val" in
              false|"") ;;
              *) echo "::error::Unexpected truthy or invalid switch value"; exit 1 ;;
            esac
          done
          test -z "$IN_ESCALATE"
          test -z "$IN_SKILL_ID"
          test -z "$IN_CHALLENGE_INPUT"
          EXPECTED_HISTORICAL_COMMIT="9b4d9b98043140188f00b14d0ac8fa6bc02491b7"
          COMMIT="$(python3 -c 'import json; print(json.load(open("scripts/upstream_watcher/legacy_plan_policy.json"))["historicalAuthorityCommit"])')"
          test "$COMMIT" = "$EXPECTED_HISTORICAL_COMMIT"
          if ! git cat-file -e "${EXPECTED_HISTORICAL_COMMIT}^{commit}" 2>/dev/null; then
            git fetch --depth=1 --no-tags origin "$EXPECTED_HISTORICAL_COMMIT"
          fi
          RESOLVED_COMMIT="$(git rev-parse "${EXPECTED_HISTORICAL_COMMIT}^{commit}")"
          test "$RESOLVED_COMMIT" = "$EXPECTED_HISTORICAL_COMMIT"

      - name: Verify PyYAML availability without token
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || { echo "::error::PyYAML is required on runner"; exit 1; }

      - name: Run hosted read-only P2 census
        env:
          CENSUS_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ".:src"
          GITHUB_ACTIONS: ${{ github.actions }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          DISPATCH_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          mkdir -p generated-output
          python3 -m scripts.upstream_watcher.hosted_census \
            --scope-file scripts/upstream_watcher/census_scope.json \
            --output generated-output/weekly-census-readonly-receipt.json

      - name: Upload redacted census receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: weekly-census-readonly-receipt
          path: generated-output/weekly-census-readonly-receipt.json
          retention-days: 7
          if-no-files-found: error
