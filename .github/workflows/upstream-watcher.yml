name: Upstream Watcher

on:
  workflow_dispatch:
    inputs:
      skill_id:
        description: "Optional: single skill to poll (default = all suites)"
        required: false
        default: ""
      apply:
        description: "Actually create issues (default: dry-run)"
        type: boolean
        default: false
      challenge_watch:
        description: "Enable two-sided challenge watch (opt-in / configured)"
        type: boolean
        default: false
      challenge_input:
        description: "Optional path to active challenges input file"
        required: false
        default: ""
      challenge_shadow:
        description: "Allow unverified challenges in shadow mode"
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily

# Prevent overlap between manual runs
concurrency: upstream-watcher

permissions:
  issues: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  watcher:
    name: Poll upstream repos for new releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run upstream watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAIA_OPERATOR_OVERRIDE: "1"
          # Repository variable is the reviewed, default-off schedule gate.
          # Setting it to "true" or "1" opts scheduled runs into challenge watch.
          GAIA_CHALLENGE_WATCH_ENABLED: ${{ vars.GAIA_CHALLENGE_WATCH_ENABLED }}
          ACTION_SKILL_ID: ${{ inputs.skill_id }}
          ACTION_APPLY: ${{ inputs.apply }}
          ACTION_CHALLENGE_WATCH: ${{ inputs.challenge_watch }}
          ACTION_CHALLENGE_INPUT: ${{ inputs.challenge_input }}
          ACTION_CHALLENGE_SHADOW: ${{ inputs.challenge_shadow }}
        run: |
          ARGS=()
          if [[ -n "$ACTION_SKILL_ID" ]]; then
            ARGS+=(--skill "$ACTION_SKILL_ID")
          fi
          if [[ "$ACTION_APPLY" == "true" || "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            ARGS+=(--apply)
          else
            ARGS+=(--dry-run)
          fi
          if [[ "$ACTION_CHALLENGE_WATCH" == "true" || "$GAIA_CHALLENGE_WATCH_ENABLED" == "true" || "$GAIA_CHALLENGE_WATCH_ENABLED" == "1" ]]; then
            ARGS+=(--challenge-watch)
            if [[ -n "$ACTION_CHALLENGE_INPUT" ]]; then
              ARGS+=(--challenge-input "$ACTION_CHALLENGE_INPUT")
            fi
            if [[ "$ACTION_CHALLENGE_SHADOW" == "true" ]]; then
              ARGS+=(--challenge-shadow)
            fi
          fi
          python scripts/upstream_watcher/watcher.py "${ARGS[@]}"
