name: Docs Cohesion Guards

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 'claude/**'
      - 'gemini/**'
      - 'design/**'
      - 'docs/**'
      - 'dev/**'

jobs:
  cohesion:
    name: Design-system lint guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.changed_files >= 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Guard A — Binary-source detector (runs BEFORE the hex scan) ──────
      # A NUL byte in a .js/.css source makes GNU grep treat the file as binary
      # and silently skip it, which is exactly how two banned hexes hid in
      # docs/js/skill-graph.js undetected. Fail loudly if any source under docs/
      # carries a NUL byte so a skipped-file gap can never recur silently.
      - name: Guard A — Detect NUL bytes in JS/CSS sources
        run: |
          set +e
          # -a forces grep to scan files it would otherwise treat as binary and
          # SKIP — without it this detector would itself miss the NUL-carrying
          # file, reproducing the very blind spot it exists to close.
          OFFENDERS=$(grep -ralP '\x00' docs/js/ docs/css/ 2>/dev/null | grep -E '\.(js|css)$')
          if [ -n "$OFFENDERS" ]; then
            echo "::error::NUL byte found in JS/CSS source(s) under docs/. A NUL"
            echo "::error::makes grep treat the file as binary and silently skip"
            echo "::error::it (Guard A hex scan blind spot). Use a text escape"
            echo "::error::like '\\u0000' instead of a literal NUL byte."
            echo "Offending files:"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "No NUL bytes in JS/CSS sources under docs/."

      # ── Guard A — Token-only colour enforcement ──────────────────────────
      - name: Guard A — Scan for hardcoded colors
        id: hardcoded-colors
        run: |
          set +e
          # scripts/check_hex_colors.py replaces the old inline grep. grep
          # silently skips files containing a NUL byte (binary-file skip), so a
          # source file with a literal '\0' was never scanned; the Python
          # scanner reads every file as text and strips // and /* */ comments so
          # a documented hex no longer trips the guard while a live-code literal
          # still does. Exit 1 + file:line:hex on failure.
          HITS=$(python scripts/check_hex_colors.py 2>&1)
          EXIT=$?

          if [ $EXIT -ne 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "hits<<EOF" >> $GITHUB_OUTPUT
            echo "$HITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Guard A — Comment on hardcoded colors
        if: steps.hardcoded-colors.outputs.found == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          HITS_OUTPUT: ${{ steps.hardcoded-colors.outputs.hits }}
        with:
          script: |
            const marker = '<!-- auto-fix-bot: hardcoded-colors -->';
            const hits = process.env.HITS_OUTPUT;
            const body = `${marker}\n## 🎨 Hardcoded colors detected\n\nUse design tokens from \`docs/css/tokens.css\` instead:\n\n\`\`\`\n${hits}\n\`\`\`\n\nReplace with \`var(--token-name)\`.`;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      # ── Guard B — Banned synonyms (per CONTEXT.md) ───────────────────────
      - name: Guard B — Scan for banned synonyms
        id: banned-synonyms
        run: |
          set +e
          HITS=$(grep -RnE \
               '\b(legendary skill|Pure \/ Undeveloped|Unwired Basics|Atomic Basics|graph-isolated singularities|Highest Tier:\s*common|top-tier skill|mythic|Undeveloped\b)\b' \
               docs/ scripts/ src/gaia_cli/ \
               --exclude='STEWARDSHIP_PLAN.md' \
               --exclude='WHY-GAIA.md' \
               --exclude='QUICKSTART.md' \
               --exclude-dir='archive' \
               --exclude-dir='samples' \
               2>/dev/null || true)

          # Rarity axis is removed (issue #356) — fail on code-level
          # regressions (quoted/key/property forms only, so prose using the
          # plain English word "rarity" doesn't false-positive). Dated
          # journals under docs/meta/ and docs/superpowers/ are historical
          # records and stay excluded, as does CONTEXT.md's own notice.
          RARITY_HITS=$(grep -RnE \
               '"rarity"|rarityLabels|highestRarity|rs-legendary|\.rarity\b|rarity:' \
               docs/ scripts/ src/gaia_cli/ packages/ tests/ registry/schema/ \
               --exclude-dir='archive' \
               --exclude-dir='meta' \
               --exclude-dir='superpowers' \
               --exclude-dir='node_modules' \
               2>/dev/null || true)
          HITS=$(printf '%s\n%s' "$HITS" "$RARITY_HITS" | sed '/^$/d')

          if [ -n "$HITS" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "hits<<EOF" >> $GITHUB_OUTPUT
            echo "$HITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Guard B — Comment on banned synonyms
        if: steps.banned-synonyms.outputs.found == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          HITS_OUTPUT: ${{ steps.banned-synonyms.outputs.hits }}
        with:
          script: |
            const marker = '<!-- auto-fix-bot: banned-synonyms -->';
            const hits = process.env.HITS_OUTPUT;
            const body = `${marker}\n## ⚠️ Banned synonyms detected\n\nSee CONTEXT.md § Banned synonyms for replacements:\n\n\`\`\`\n${hits}\n\`\`\`\n\nPlease update these before merge.`;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      # ── Guard C — Direction rule (Ultimate-first sort enforcement) ───────
      - name: Guard C — Scan for unlabeled sorts
        id: unlabeled-sorts
        run: |
          set +e
          HITS=$(grep -RnE 'levels?\.sort\(.*a\s*-\s*b|sortBy.*level.*asc' \
               docs/js/ scripts/ \
               --include='*.js' --include='*.py' \
               2>/dev/null | grep -v 'data-pattern.*journey' || true)

          if [ -n "$HITS" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "hits<<EOF" >> $GITHUB_OUTPUT
            echo "$HITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Guard C — Comment on unlabeled sorts
        if: steps.unlabeled-sorts.outputs.found == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          HITS_OUTPUT: ${{ steps.unlabeled-sorts.outputs.hits }}
        with:
          script: |
            const marker = '<!-- auto-fix-bot: unlabeled-sorts -->';
            const hits = process.env.HITS_OUTPUT;
            const body = `${marker}\n## 📊 Unlabeled ascending-level sorts\n\nAll skill lists default to Ultimate-first (descending). If a journey/progression sort is intentional, add a comment:\n\n\`\`\`javascript\n// data-pattern="journey"\nsortBy(...)\n\`\`\`\n\nFound in:\n\`\`\`\n${hits}\n\`\`\``;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      # ── Guard D — Nav mounts sync check ─────────────────────────────────
      - name: Guard D — Nav mounts in sync
        id: nav-mounts
        run: |
          set +e
          OUTPUT=$(python scripts/check_nav_mounts.py 2>&1)
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "hits<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Guard D — Comment on nav mounts drift
        if: steps.nav-mounts.outputs.found == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          HITS_OUTPUT: ${{ steps.nav-mounts.outputs.hits }}
        with:
          script: |
            const marker = '<!-- auto-fix-bot: nav-mounts -->';
            const hits = process.env.HITS_OUTPUT;
            const body = `${marker}\n## Nav/footer mounts out of sync\n\nA new \`docs/\` subdirectory uses \`site-nav.js\` or \`site-footer.js\` but is not listed in \`docs/js/mounts.js\`.\n\nAdd its name to \`window.GAIA_MOUNTS\` in that file, and ensure every HTML page in the directory loads \`mounts.js\` before \`site-nav.js\`.\n\n\`\`\`\n${hits}\n\`\`\``;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      # ── Guard E — docs/graph regeneration check ─────────────────────────
      - name: Guard E — docs/graph regeneration
        id: docs-graph-regen
        if: github.event_name == 'pull_request'
        run: |
          # Skip if PR carries the bypass label
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          if echo "$LABELS" | grep -q 'skip-docs-regen-check'; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Skipping Guard E: skip-docs-regen-check label present."
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED=$(git diff --name-only "$BASE_SHA..$HEAD_SHA")

          REGISTRY_CHANGED=$(echo "$CHANGED" | grep -qE '^registry/(nodes|named)/' && echo "true" || echo "false")
          GRAPH_CHANGED=$(echo "$CHANGED" | grep -qE '^docs/graph/' && echo "true" || echo "false")

          if [ "$REGISTRY_CHANGED" = "true" ] && [ "$GRAPH_CHANGED" = "false" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Guard E — Fail on missing docs/graph update
        if: steps.docs-graph-regen.outputs.found == 'true'
        run: |
          echo "::error::registry/ source changed but docs/graph/ did not. Run \`gaia dev docs\` and commit the regenerated docs/graph/* files. See founder/handovers/EPIC780_OPTION_A_DECISION.md for why this is enforced."
          exit 1

      # ── Final Status ─────────────────────────────────────────────────────
      - name: Verify all cohesion guards passed
        run: |
          FAILED=false
          if [ "${{ steps.hardcoded-colors.outputs.found }}" = "true" ]; then
            echo "FAIL Guard A: Hardcoded colors found."
            FAILED=true
          fi
          if [ "${{ steps.banned-synonyms.outputs.found }}" = "true" ]; then
            echo "FAIL Guard B: Banned synonyms found."
            FAILED=true
          fi
          if [ "${{ steps.unlabeled-sorts.outputs.found }}" = "true" ]; then
            echo "FAIL Guard C: Unlabeled ascending sorts found."
            FAILED=true
          fi
          if [ "${{ steps.nav-mounts.outputs.found }}" = "true" ]; then
            echo "FAIL Guard D: Nav mounts out of sync."
            FAILED=true
          fi

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          echo "All cohesion guards passed."
