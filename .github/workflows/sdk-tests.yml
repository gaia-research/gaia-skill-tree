name: SDK Tests

permissions:
  contents: read

on:
  push:
    paths:
      - 'packages/api-client-ts/**'
      - 'packages/api-client-py/**'
  pull_request:
    paths:
      - 'packages/api-client-ts/**'
      - 'packages/api-client-py/**'

# A new push to a PR cancels the run it supersedes; branch pushes never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: packages/api-client-ts
        run: npm ci || npm install

      - name: Type check
        working-directory: packages/api-client-ts
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: packages/api-client-ts
        run: npx vitest run

      - name: Build
        working-directory: packages/api-client-ts
        run: npx tsup

  python:
    name: Python SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: packages/api-client-py/pyproject.toml

      - name: Install dependencies
        working-directory: packages/api-client-py
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        working-directory: packages/api-client-py
        run: ruff check src/ tests/

      - name: Run tests
        working-directory: packages/api-client-py
        run: pytest tests/ -v --tb=short
