name: Calibration Drift Guard

# Prevention gate for trust_calibration_drift (#2283): a pull request may not
# introduce a named skill whose stored level disagrees with its computed Trust
# Magnitude grade unless it recalibrates in the same PR. Drift already present on
# the base is tolerated (the set only shrinks). Report only: it never calibrates.
# Not a required check; rollout is a founder decision.

on:
  pull_request:
    paths:
      - 'registry/named/**'
      - 'registry/nodes/**'
      - 'src/gaia_cli/**'
      - 'scripts/check_calibration_drift.py'
      - '.github/workflows/calibration-drift-guard.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calibration-drift:
    name: Calibration Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Gaia
        run: python -m pip install --quiet -e .

      - name: Run calibration drift gate
        # One exact base: the PR base (GITHUB_BASE_REF), or for a manual run the
        # default branch. An unresolvable base fails closed (exit 2).
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/check_calibration_drift.py --base "origin/$DEFAULT_BRANCH"
          else
            python scripts/check_calibration_drift.py
          fi
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
