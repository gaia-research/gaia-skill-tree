name: Meta Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'registry/nodes/**'
      - 'registry/named/**'
      - 'registry/named-skills.json'
      - 'skill-trees/**'

# A new push or label event cancels the run it supersedes (same PR head).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meta-guard:
    name: Verify registry/timeline mutations come from an authorized actor
    runs-on: ubuntu-latest
    # Skip when a bypass label is present, or for known bot actors.
    # Mirrors the label-gate pattern used in branch-scope.yml.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-meta-guard') &&
      !contains(github.event.pull_request.labels.*.name, 'jules') &&
      !contains(github.event.pull_request.labels.*.name, 'Jules') &&
      !contains(github.event.pull_request.labels.*.name, 'codex') &&
      !contains(github.event.pull_request.labels.*.name, 'claude-bot') &&
      !contains(github.event.pull_request.labels.*.name, 'gemini-bot')
    permissions:
      pull-requests: read
      contents: read
    steps:
      # Check out the BASE commit: the Verifier set must come from the registry
      # the PR targets, never from the PR itself, or a PR could promote its own
      # author. The PR's commits are fetched separately below. Full history
      # without blobs; working tree limited to what the index build needs.
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            registry
            scripts
            src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # registry/named-skills.json is a gitignored Class P artifact, so it never
      # exists in a fresh checkout. Without this step the check below fell back
      # to bootstrap and authorized every actor (#1815).
      - name: Build the base named-skills index
        run: |
          uv pip install --system -e .
          python scripts/assemble_gaia.py
          python scripts/generateNamedIndex.py

      - name: Check authorized meta mutation
        env:
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # ── Bot actor allowlist ──────────────────────────────────────────────
          # Automated regen/sync PRs (github-actions[bot], jules, codex, etc.)
          case "$PR_ACTOR" in
            *\[bot\]|github-actions|jules|codex|claude-bot|gemini-bot|mbtiongson1)
              echo "✓ $PR_ACTOR is an allowlisted automated or maintainer actor."
              exit 0
              ;;
          esac

          # HEAD is the base commit. Fetch the PR head (works for forks too).
          git fetch --quiet origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          MERGE_BASE=$(git merge-base HEAD "$HEAD_SHA")
          echo "PR actor:   $PR_ACTOR"
          echo "Merge base: $MERGE_BASE"
          echo ""

          # ── Collect files from human, non-merge commits only ────────────────
          # Merge commits and github-actions[bot] commits are excluded so
          # automated maintenance does not cause false failures.
          HUMAN_COMMITS=$(
            git log --no-merges --format="%H %ae" "$MERGE_BASE..$HEAD_SHA" \
              | { grep -v 'github-actions\[bot\]' || true; } \
              | awk '{print $1}'
          )

          if [ -z "$HUMAN_COMMITS" ]; then
            echo "✓ No human commits found (only merge/bot commits). Nothing to check."
            exit 0
          fi

          # Files this PR mutates under guarded meta paths
          FILES=$(
            while IFS= read -r sha; do
              [ -z "$sha" ] && continue
              git diff-tree --no-commit-id -r --name-only "$sha"
            done <<< "$HUMAN_COMMITS" \
              | grep -E '^(registry/nodes/|registry/named/|registry/named-skills\.json|skill-trees/)' \
              | sort -u || true
          )

          if [ -z "$FILES" ]; then
            echo "✓ No guarded meta files changed by human commits."
            exit 0
          fi

          echo "Guarded meta files changed:"
          echo "$FILES" | sed 's/^/  - /'
          echo ""

          # ── Map PR actor → Verifier status via the base registry ─────────────
          # Same code path as `gaia whoami` (src/gaia_cli/authz.py): the actor
          # holds a 4★+ named skill, or the registry has no Verifiers yet
          # (bootstrap). authz reads a missing index as bootstrap, so refuse to
          # run without it rather than authorize everyone.
          if [ ! -f registry/named-skills.json ]; then
            echo "::error::registry/named-skills.json was not built; refusing to fall back to bootstrap."
            exit 1
          fi
          AUTHORIZED=$(env -u GAIA_OPERATOR_OVERRIDE python - "$PR_ACTOR" <<'PY'
          import sys
          from gaia_cli.authz import authorization_status
          print(authorization_status(sys.argv[1], ".")["via"])
          PY
          )

          echo "Actor authorization: $AUTHORIZED"
          echo ""

          if [ "$AUTHORIZED" = "verifier" ] || [ "$AUTHORIZED" = "bootstrap" ]; then
            echo "✓ $PR_ACTOR is authorized ($AUTHORIZED)."
            exit 0
          fi

          # ── Detect timeline-array additions as additional context ────────────
          TIMELINE_ADDS=$(
            git diff "$MERGE_BASE...$HEAD_SHA" -- registry/nodes/ skill-trees/ \
              | grep -E '^\+' \
              | grep -E '"(timeline|action|skillId)"' || true
          )

          echo "::error::$PR_ACTOR is not a Verifier (no 4★+ named skill) but this PR mutates guarded registry/timeline files."
          echo ""
          echo "Guarded files changed by $PR_ACTOR:"
          echo "$FILES" | sed 's/^/  - /'
          if [ -n "$TIMELINE_ADDS" ]; then
            echo ""
            echo "Timeline-related additions detected in diff."
          fi
          echo ""
          echo "Remediation options:"
          echo "  1. Have a Verifier (4★+ contributor) author or co-sign the change."
          echo "  2. Add the 'skip-meta-guard' label to this PR (maintainer override)."
          echo "  3. If running in CI/automation, set GAIA_OPERATOR_OVERRIDE=1 and"
          echo "     ensure the PR is opened by an allowlisted bot account."
          echo "  4. Run \`gaia whoami\` locally to check your Verifier status."
          exit 1

  # ── Job: apex-gate ────────────────────────────────────────────────────────
  # Fires only on PRs that PROMOTE a skill to 6★ (apex-promotion label OR
  # the diff contains a newly-added "6★" level line in registry/named/ or
  # registry/nodes/).  Does NOT fire on demotions (label absent + no new 6★
  # lines means the condition is false).
  apex-gate:
    name: Apex gate check (6★ promotion)
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.pull_request.labels.*.name, 'apex-promotion') ||
      contains(github.event.pull_request.body, '6★')
    permissions:
      pull-requests: read
      contents: read
    steps:
      # History for merge-base; the 6★ diff lazily fetches only the blobs it reads.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      # check_verifier_signoffs.py reads registry/named-skills.json, a gitignored
      # Class P artifact; without it no sign-off can ever count (#1815). Build it
      # from the BASE commit, with the base's own scripts, so a PR cannot promote
      # its own sign-off authors into Verifiers.
      - name: Build the base named-skills index
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_TREE="$RUNNER_TEMP/base"
          git worktree add --no-checkout --detach "$BASE_TREE" "$BASE_SHA"
          git -C "$BASE_TREE" sparse-checkout set registry scripts src
          git -C "$BASE_TREE" checkout -q
          (cd "$BASE_TREE" && python scripts/assemble_gaia.py && python scripts/generateNamedIndex.py)
          cp "$BASE_TREE/registry/named-skills.json" registry/named-skills.json

      - name: Require apex-promotion label
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if echo "$PR_LABELS" | python3 -c "import sys,json; labels=json.load(sys.stdin); sys.exit(0 if 'apex-promotion' in labels else 1)"; then
            echo "✓ apex-promotion label present."
          else
            echo "::error::PRs promoting a skill to 6★ require the 'apex-promotion' label."
            echo "  Add the label and request re-review, or remove the 6★ level change from this PR."
            exit 1
          fi

      - name: Detect newly-promoted 6★ skills in diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          PROMOTED=$(
            git diff "$MERGE_BASE..HEAD" -- registry/named/ registry/nodes/ \
              | grep -E '^\+[^+].*level:.*6' || true
          )
          if [ -z "$PROMOTED" ]; then
            echo "No newly-promoted 6★ skills detected in diff (body triggered gate)."
            echo "  If this is intentional, the apex-promotion label was sufficient."
            exit 0
          fi
          echo "Newly-promoted 6★ line(s) detected:"
          echo "$PROMOTED" | sed 's/^/  /'

      - name: Check verifier sign-offs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/check_verifier_signoffs.py \
            --pr ${{ github.event.pull_request.number }} \
            --min-signoffs 2

      - name: Run apex gate audit on promoted skills
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          python scripts/auditApexAtG7.py --pr ${{ github.event.pull_request.number }}

  # ── Job: system-wide-cap ──────────────────────────────────────────────────
  # Fires on every PR touching registry/named/ or registry/nodes/.
  # Reads apexGate.systemWideCap from registry/schema/meta.json (never
  # hardcoded) and fails if the post-merge 6★ count would exceed it.
  system-wide-cap:
    name: System-wide apex cap check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      # Counts the checked-out registry only; no history needed.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Count apex skills and enforce system-wide cap
        run: |
          set -euo pipefail
          python scripts/countApexSkills.py --json --check-cap
