name: Auto-Sync Registry Artifacts

on:
  # Run on EVERY push to the default branch — not just registry/script changes —
  # so CLI-only and docs-only merges also get a version bump and release proposal.
  # The proposal job skips bot/[skip-gen] commits to prevent release-PR recursion.
  push:
    branches: [main]
  workflow_dispatch:
  # Finalize only a merged release PR targeting main; never publish from its branch.
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: write   # dispatch publish-pypi.yml (workflow_dispatch)

# Serialize proposal runs on main and finalization runs per PR.
concurrency:
  group: sync-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  propose:
    name: Regenerate Artifacts and Propose Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Do not run the proposal on PR-close events. Push events retain the
    # subject/body skip-gen recursion guard; workflow_dispatch is gated after checkout.
    if: >-
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch &&
       github.actor != 'github-actions[bot]' &&
       !contains(github.event.head_commit.message, '[skip-gen]') &&
       !contains(github.event.head_commit.message, 'chore(auto): release v')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # workflow_dispatch has no reliable head_commit.message. Check the actual
      # checked-out commit before any other proposal step, including secret use.
      - name: Gate generated release commits
        id: proposal_gate
        run: |
          set -euo pipefail
          MSG=$(git log -1 --format=%B)
          if [[ "$MSG" == *"[skip-gen]"* || "$MSG" == *"chore(auto): release v"* ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping generated release commit."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Token for Branch and PR Creation
        if: steps.proposal_gate.outputs.proceed == 'true'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          # Former direct push URL: git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "${TAG}"
          if [[ -n "$RELEASE_PAT" ]] && USER=$(GH_TOKEN="$RELEASE_PAT" gh api user --jq .login 2>/dev/null); then
            echo "AUTH_TOKEN_NAME=RELEASE_PAT" >> "$GITHUB_ENV"
            echo "Validated RELEASE_PAT (authenticated as $USER)."
          else
            echo "AUTH_TOKEN_NAME=GITHUB_TOKEN" >> "$GITHUB_ENV"
            echo "::warning::RELEASE_PAT is not set or invalid; falling back to GITHUB_TOKEN."
          fi

      - name: Set up Python
        if: steps.proposal_gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.proposal_gate.outputs.proceed == 'true'
        run: pip install -e ".[dev]"

      - name: Configure git identity
        if: steps.proposal_gate.outputs.proceed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Auto-Versioning and Regeneration
        if: steps.proposal_gate.outputs.proceed == 'true'
        env:
          # Fresh runners have no gitignored Class P named index; this step's
          # gated release must bootstrap the artifact regeneration pipeline.
          GAIA_OPERATOR_OVERRIDE: "1"
        run: |
          # Preserve the established classifier and release-channel mapping.
          MSG=$(git log -1 --format=%B)
          BUMP="patch"
          if echo "$MSG" | grep -Eq 'BREAKING CHANGE|^[a-zA-Z]+(\([^)]*\))?!:'; then BUMP="major"; fi
          if echo "$MSG" | grep -Eq '^feat(\([^)]*\))?:'; then BUMP="minor"; fi
          case "$BUMP" in
            major) CHANNEL="production" ;;
            minor) CHANNEL="beta" ;;
            *)     CHANNEL="canary" ;;
          esac
          echo "GAIA_BUMP=$BUMP" >> "$GITHUB_ENV"
          echo "GAIA_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "Bump: $BUMP → channel: $CHANNEL"

          # --no-push keeps the release commit local until this job publishes the
          # deterministic version branch. The PR must pass Main Ruleset checks.
          gaia dev release "$BUMP" --sync --no-push
          gaia dev docs

      - name: Restore badges from HEAD (auto-sync must NOT touch docs/badges/)
        if: steps.proposal_gate.outputs.proceed == 'true'
        # docs/badges/_assets/ and docs/badges/registry.json are NEVER
        # regenerated by auto-sync. They're a Cloudflare-served reward artifact
        # whose source-of-truth is human curation via infra/ PRs. The auto-sync
        # runner may hydrate registry/named-skills.json from a stale release;
        # that can make `gaia dev docs` regenerate a near-empty badge tree and
        # wipe live contributor SVGs. Restore from the checked-out baseline so
        # auto-sync cannot erase the human-curated badge tree. See the founder
        # rationale: founder/CLAUDE.md, "Why auto-sync was banned from docs/badges/".
        run: |
          git checkout HEAD -- docs/badges/_assets/ docs/badges/registry.json || true
          if [[ -n "$(git status --porcelain docs/badges/)" ]]; then
            echo "::warning::auto-sync produced badge drift; reverted to HEAD"
            git status --porcelain docs/badges/
          fi

      - name: Push version branch and create or update PR
        if: steps.proposal_gate.outputs.proceed == 'true'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            LAST_MSG=$(git log -1 --format=%B)
            if [[ "$LAST_MSG" == chore:\ release\ v* ]]; then
              git commit --amend -m "chore(auto): release v${VERSION} [skip-gen]"
            else
              git commit -m "chore(auto): release v${VERSION} [skip-gen]"
            fi
          elif [[ "$(git log -1 --format=%s)" == chore:\ release\ v* ]]; then
            git commit --amend -m "chore(auto): release v${VERSION} [skip-gen]"
          fi

          BRANCH="chore/auto-release-v${VERSION}"
          git switch -C "$BRANCH"

          CRED="${GITHUB_TOKEN}"
          if [[ "${AUTH_TOKEN_NAME:-}" == "RELEASE_PAT" && -n "${RELEASE_PAT:-}" ]]; then
            CRED="${RELEASE_PAT}"
          fi
          export GH_TOKEN="$CRED"

          AUTH_B64=$(printf "x-access-token:%s" "$CRED" | base64 -w 0 2>/dev/null || printf "x-access-token:%s" "$CRED" | base64)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH_B64}"

          REMOTE_SHA=$(git ls-remote origin "refs/heads/${BRANCH}" | awk 'NR==1 {print $1}')
          if ! git push --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}" origin "HEAD:refs/heads/${BRANCH}"; then
            echo "::error::Could not push release branch to origin."
            exit 1
          fi

          if ! PR=$(gh pr list --state open --base main --head "$BRANCH" --json number --jq '.[0].number'); then
            echo "::error::Could not query release PRs."
            exit 1
          fi
          if [[ -n "$PR" ]]; then
            gh pr edit "$PR" --title "chore(auto): release v${VERSION} [skip-gen]" \
              --body "Automated version and generated-artifact proposal for v${VERSION}. This PR must pass the required main status checks before merge. Release tags and publication are created only after merge."
            echo "Updated open release PR #${PR}."
          else
            if ! gh pr create --base main --head "$BRANCH" \
              --title "chore(auto): release v${VERSION} [skip-gen]" \
              --body "Automated version and generated-artifact proposal for v${VERSION}. This PR must pass the required main status checks before merge. Release tags and publication are created only after merge."; then
              echo "::error::Could not create release PR."
              exit 1
            fi
          fi

  finalize:
    name: Finalize Merged Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'chore/auto-release-v') &&
      startsWith(github.event.pull_request.title, 'chore(auto): release v') &&
      endsWith(github.event.pull_request.title, '[skip-gen]')
    steps:
      - name: Checkout merged main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Validate release PR identity
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          VERSION="${PR_BRANCH##*-v}"
          if [[ "$PR_REPOSITORY" != "$GITHUB_REPOSITORY" || "$PR_TITLE" != "chore(auto): release v${VERSION} [skip-gen]" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Merged PR does not have the expected same-repository generated release title/branch pair."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Regenerate Class P artifacts for packaging
        env:
          GAIA_OPERATOR_OVERRIDE: "1"
        run: gaia dev docs

      - name: Restore badges from merged HEAD (auto-sync must NOT touch docs/badges/)
        # Keep this boundary in both proposal and finalization: badges are
        # Cloudflare-served, human-curated artifacts and must not be overwritten
        # by stale runner registry data during the Class P regeneration below.
        run: |
          git checkout HEAD -- docs/badges/_assets/ docs/badges/registry.json || true
          if [[ -n "$(git status --porcelain docs/badges/)" ]]; then
            echo "::warning::auto-sync produced badge drift; reverted to merged HEAD"
            git status --porcelain docs/badges/
          fi

      - name: Verify merge, generated docs, and release channel
        run: |
          set -euo pipefail
          git fetch origin main
          MERGE_SHA='${{ github.event.pull_request.merge_commit_sha }}'
          if [[ -z "$MERGE_SHA" ]] || ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
            echo "::error::Merged release commit is not present on origin/main; refusing finalization."
            exit 1
          fi
          # Class S artifacts are committed site output. Never package a tar from
          # regenerated but uncommitted docs that differ from the merged commit.
          if ! git diff --quiet HEAD -- docs/; then
            echo "::error::gaia dev docs changed tracked docs/ output after merge; refusing to package Class S drift."
            git diff --stat HEAD -- docs/
            exit 1
          fi
          version_at() {
            git show "$1:pyproject.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1
          }
          BASE_SHA=$(git rev-parse "${MERGE_SHA}^1")
          BASE_VERSION=$(version_at "$BASE_SHA")
          VERSION=$(version_at "$MERGE_SHA")
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not derive valid base and merged X.Y.Z versions from pyproject.toml."
            exit 1
          fi
          IFS=. read -r BASE_MAJOR BASE_MINOR BASE_PATCH <<< "$BASE_VERSION"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( MAJOR == BASE_MAJOR + 1 && MINOR == 0 && PATCH == 0 )); then
            BUMP=major; CHANNEL=production
          elif (( MAJOR == BASE_MAJOR && MINOR == BASE_MINOR + 1 && PATCH == 0 )); then
            BUMP=minor; CHANNEL=beta
          elif (( MAJOR == BASE_MAJOR && MINOR == BASE_MINOR && PATCH == BASE_PATCH + 1 )); then
            BUMP=patch; CHANNEL=canary
          else
            echo "::error::Merged version $VERSION is not an exact one-step major, minor, or patch transition from $BASE_VERSION."
            exit 1
          fi
          echo "GAIA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "GAIA_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "GAIA_BUMP=$BUMP" >> "$GITHUB_ENV"
          echo "Finalizing v$VERSION: $BASE_VERSION → $VERSION ($CHANNEL)."

      - name: Verify any existing release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${GAIA_VERSION}"
          RELEASE_JSON=$(gh release view "$TAG" --json name,isPrerelease,isDraft,assets 2>/dev/null || true)
          if [[ -n "$RELEASE_JSON" ]]; then
            RELEASE_NAME=$(jq -r '.name // ""' <<< "$RELEASE_JSON")
            IS_PRERELEASE=$(jq -r '.isPrerelease' <<< "$RELEASE_JSON")
            IS_DRAFT=$(jq -r '.isDraft' <<< "$RELEASE_JSON")
            EXPECT_PRERELEASE=false
            [[ "$GAIA_CHANNEL" == production ]] || EXPECT_PRERELEASE=true
            if [[ "$RELEASE_NAME" != "${TAG} (${GAIA_CHANNEL})" || "$IS_PRERELEASE" != "$EXPECT_PRERELEASE" || "$IS_DRAFT" != false ]]; then
              echo "::error::Existing release ${TAG} has channel/name/draft metadata inconsistent with ${GAIA_CHANNEL}; refusing finalization."
              exit 1
            fi
          fi

      - name: Tag Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${GAIA_VERSION}"
          TAG_REFS=$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          REMOTE_SHA=$(awk -v tag="refs/tags/${TAG}" '$2 == tag {sha=$1} $2 == tag "^{}" {sha=$1} END {print sha}' <<< "$TAG_REFS")
          MERGE_SHA='${{ github.event.pull_request.merge_commit_sha }}'
          if [[ -n "$REMOTE_SHA" ]]; then
            if [[ "$REMOTE_SHA" != "$MERGE_SHA" ]]; then
              echo "::error::Remote tag ${TAG} peels to ${REMOTE_SHA}, not merged commit ${MERGE_SHA}; refusing to overwrite it."
              exit 1
            fi
            echo "Tag ${TAG} already points to the merged commit; continuing idempotently."
          else
            git tag "$TAG" "$MERGE_SHA"
            # GITHUB_TOKEN does not trigger release.yml on tag push. This job
            # creates the release itself via the API below after checking channel.
            git push origin "$TAG"
          fi

      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${GAIA_VERSION}"
          ARTIFACT_NAME=gaia-artifacts.tar.gz
          RELEASE_JSON=$(gh release view "$TAG" --json name,isPrerelease,isDraft,assets 2>/dev/null || true)
          EXPECT_PRERELEASE=false
          [[ "$GAIA_CHANNEL" == production ]] || EXPECT_PRERELEASE=true
          if [[ -n "$RELEASE_JSON" ]]; then
            RELEASE_NAME=$(jq -r '.name // ""' <<< "$RELEASE_JSON")
            IS_PRERELEASE=$(jq -r '.isPrerelease' <<< "$RELEASE_JSON")
            IS_DRAFT=$(jq -r '.isDraft' <<< "$RELEASE_JSON")
            if [[ "$RELEASE_NAME" != "${TAG} (${GAIA_CHANNEL})" || "$IS_PRERELEASE" != "$EXPECT_PRERELEASE" || "$IS_DRAFT" != false ]]; then
              echo "::error::Existing release ${TAG} has channel/name/draft metadata inconsistent with ${GAIA_CHANNEL}; refusing reuse."
              exit 1
            fi
          else
            if [[ "$GAIA_CHANNEL" == production ]]; then
              CHANNEL_FLAGS=(--latest)
            else
              CHANNEL_FLAGS=(--prerelease --latest=false)
            fi
            gh release create "$TAG" --title "${TAG} (${GAIA_CHANNEL})" --generate-notes "${CHANNEL_FLAGS[@]}"
            RELEASE_JSON=$(gh release view "$TAG" --json name,isPrerelease,isDraft,assets)
          fi

          echo "Packaging generated registry and graph artifacts..."
          # registry/gaia.svg was retired under Yggdrasil II; the GEXF export
          # survives. Keep this list aligned with the canonical release payload.
          ARTIFACTS=(
            registry/gaia.json
            registry/gaia.gexf
            registry/layouts_3d.json
            registry/named-skills.json
            registry/real-skills.json
            registry/real-skills.md
            docs/graph/
          )
          if [ -d registry/support ]; then ARTIFACTS+=(registry/support/); fi
          tar -czf "$ARTIFACT_NAME" "${ARTIFACTS[@]}"

          if jq -e --arg name "$ARTIFACT_NAME" '.assets[]? | select(.name == $name)' <<< "$RELEASE_JSON" >/dev/null; then
            TMPDIR=$(mktemp -d)
            gh release download "$TAG" --pattern "$ARTIFACT_NAME" --dir "$TMPDIR"
            if cmp -s "$ARTIFACT_NAME" "$TMPDIR/$ARTIFACT_NAME"; then
              echo "Existing ${ARTIFACT_NAME} matches generated artifact; skipping upload."
            else
              echo "Existing ${ARTIFACT_NAME} differs; replacing only after byte comparison."
              gh release upload "$TAG" "$ARTIFACT_NAME" --clobber
            fi
            rm -rf "$TMPDIR"
          else
            gh release upload "$TAG" "$ARTIFACT_NAME"
          fi

      - name: Publish to PyPI
        if: env.GAIA_CHANNEL == 'production'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Production only: PyPI is dispatched for major bumps. Minor/Beta and
          # patch/Canary remain GitHub pre-releases; a one-off override is manual.
          gh workflow run publish-pypi.yml --ref "v${GAIA_VERSION}" \
            && echo "Dispatched publish-pypi.yml (production) for v${GAIA_VERSION}." \
            || echo "::warning::Could not dispatch publish-pypi.yml — publish PyPI manually if needed."
