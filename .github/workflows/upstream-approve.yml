name: Upstream Approve

on:
  issues:
    types: [labeled, opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to re-run approve logic on"
        required: true
        type: string

concurrency:
  group: upstream-approve-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  approve:
    name: Process upstream:approved label
    runs-on: ubuntu-latest
    # Only fire when:
    # 1. The applied label is upstream:approved (issues labeled path)
    # 2. An issue is opened with upstream:approved (issues opened path, e.g. auto-bootstrap)
    # 3. Manually dispatched or re-run (retry path)
    if: >-
      (github.event_name == 'issues' && (
        (github.event.action == 'labeled' && github.event.label.name == 'upstream:approved')
        || (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'upstream:approved'))
      ))
      || github.event_name == 'workflow_dispatch'

    steps:
      - name: Resolve issue number and actor
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "actor=${{ github.actor }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "actor=${{ github.event.sender.login }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Guard: labeler must be a Verifier ──────────────────────────────────
      - name: Check labeler is a Verifier
        env:
          LABELER: ${{ steps.issue.outputs.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail

          # Bot actors are always allowed
          case "$LABELER" in
            *\[bot\]|github-actions|jules|codex|claude-bot|gemini-bot|mbtiongson1)
              echo "✓ $LABELER is an allowlisted actor."
              exit 0
              ;;
          esac

          AUTHORIZED=$(python3 - "$LABELER" <<'PY'
          import json, sys, os

          actor = sys.argv[1]
          index_path = "registry/named-skills.json"

          if not os.path.exists(index_path):
              print("bootstrap")
              sys.exit(0)

          try:
              with open(index_path, "r", encoding="utf-8") as f:
                  idx = json.load(f)
          except Exception:
              print("bootstrap")
              sys.exit(0)

          has_any_verifier = False
          for entries in idx.get("buckets", {}).values():
              for e in entries:
                  lvl = e.get("level", "")
                  if lvl and lvl[0].isdigit() and int(lvl[0]) >= 4:
                      has_any_verifier = True
                      if e.get("contributor") == actor:
                          print("yes")
                          sys.exit(0)

          if not has_any_verifier:
              print("bootstrap")
          else:
              print("no")
          PY
          )

          echo "Labeler authorization: $AUTHORIZED"
          if [ "$AUTHORIZED" = "yes" ] || [ "$AUTHORIZED" = "bootstrap" ]; then
            echo "✓ $LABELER is authorized to approve upstream issues."
          else
            echo "::error::$LABELER is not a Verifier (no 4★+ named skill). Only Verifiers may apply upstream:approved."
            gh issue comment "$ISSUE_NUMBER" \
              --body "⚠️ **Authorization failure:** \`$LABELER\` does not hold a 4★+ named skill and cannot approve upstream syncs. The \`upstream:approved\` label has been applied but no PR will be opened. Please have a Verifier re-apply the label."
            exit 1
          fi

      # ── Parse machine-readable payload from issue body ─────────────────────
      - name: Extract payload from issue body
        id: payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail

          BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')

          PAYLOAD_JSON=$(echo "$BODY" | python3 -c "
          import sys, re, json

          body = sys.stdin.read()
          m = re.search(r'<!-- gaia-upstream-payload\s+(.*?)-->', body, re.DOTALL)
          if not m:
              print('{}', file=sys.stderr)
              sys.exit(1)

          try:
              data = json.loads(m.group(1))
              print(json.dumps(data))
          except json.JSONDecodeError as e:
              print(f'JSON parse error: {e}', file=sys.stderr)
              sys.exit(1)
          " 2>"$RUNNER_TEMP/parse_error.txt" || true)

          if [ -z "$PAYLOAD_JSON" ] || [ "$PAYLOAD_JSON" = "{}" ]; then
            ERROR=$(cat "$RUNNER_TEMP/parse_error.txt" 2>/dev/null || echo "unknown parse error")
            gh issue comment "$ISSUE_NUMBER" \
              --body "⚠️ **Payload parse failure.** Could not extract the machine-readable payload from this issue body. Error: \`$ERROR\`. Cannot proceed with sync."
            exit 1
          fi

          echo "payload=$PAYLOAD_JSON" >> $GITHUB_OUTPUT

          SKILL_ID=$(echo "$PAYLOAD_JSON" | jq -r '.skillId')
          NEW_VERSION=$(echo "$PAYLOAD_JSON" | jq -r '.newVersion')
          SOURCE_URL=$(echo "$PAYLOAD_JSON" | jq -r '.sourceUrl')
          RELEASED_AT=$(echo "$PAYLOAD_JSON" | jq -r '.releasedAt')
          MODE=$(echo "$PAYLOAD_JSON" | jq -r '.mode')

          echo "skill_id=$SKILL_ID" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "source_url=$SOURCE_URL" >> $GITHUB_OUTPUT
          echo "released_at=$RELEASED_AT" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      # ── Child-gate: check all upstream:child issues are closed ─────────────
      - name: Check child gate
        id: child_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Skip gate if skip-child-gate label is applied. This bypasses the gate only:
          # it never closes, accepts or rejects a child intake or the umbrella.
          HAS_SKIP=$(gh issue view "$ISSUE_NUMBER" --json labels \
            --jq '[.labels[].name] | contains(["skip-child-gate"])')
          if [ "$HAS_SKIP" = "true" ]; then
            echo "skip-child-gate label present: bypassing the child-resolution gate only."
            echo "skip-child-gate does not close, accept or reject any child intake or the umbrella."
            echo "gate_passed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fail closed: a lookup error is never read as "no open children".
          fail_closed() {
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ **Child gate could not verify child intakes.** $1 No sync was attempted and no PR was opened. Re-apply upstream:approved to retry, or add skip-child-gate to bypass the gate (the bypass never closes or accepts children)." || true
            echo "::error::Child gate could not verify child intakes: $1"
            exit 1
          }

          UMBRELLA_BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body') || fail_closed "Could not read the umbrella body."

          # Deterministic lookup (no search). Same block as upstream-close-children.yml.
          LOOKUP_RC=0
          OPEN_JSON=$(UMBRELLA_BODY="$UMBRELLA_BODY" REPO="$REPO" ISSUE_NUMBER="$ISSUE_NUMBER" python3 - <<'PY'
          # shared-child-lookup v1 (identical in upstream-approve.yml and upstream-close-children.yml; parity-tested)
          import json
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import urlencode

          REPO = os.environ["REPO"]
          UMBRELLA = int(os.environ["ISSUE_NUMBER"])
          BODY = os.environ.get("UMBRELLA_BODY", "")
          PAYLOAD_RE = re.compile(r"<!-- gaia-upstream-payload\s+(.*?)-->", re.DOTALL)
          UMBRELLA_RE = re.compile(r"Umbrella:\s*#(\d+)")


          class ChildAbsent(Exception):
              """GitHub answered 404 or 410: the object is definitively gone."""


          def gh_api(path, paginate=False):
              args = ["gh", "api"] + (["--paginate"] if paginate else []) + [path]
              res = subprocess.run(args, capture_output=True, text=True, timeout=120)
              if res.returncode != 0:
                  message = f"gh api {path} exited {res.returncode}: {res.stderr.strip()}"
                  if re.search(r"HTTP (404|410)\b", res.stderr or ""):
                      raise ChildAbsent(message)
                  raise RuntimeError(message)
              return res.stdout


          def decode_pages(text):
              # gh api --paginate prints one JSON array per page, back to back. Read every page.
              decoder = json.JSONDecoder()
              items, pos = [], 0
              while True:
                  while pos < len(text) and text[pos].isspace():
                      pos += 1
                  if pos >= len(text):
                      return items
                  page, pos = decoder.raw_decode(text, pos)
                  if not isinstance(page, list):
                      raise RuntimeError("issue list page is not a JSON array")
                  items.extend(page)


          def main():
              children = {}
              query = urlencode({"state": "open", "labels": "upstream:child", "per_page": 100})
              for issue in decode_pages(gh_api(f"repos/{REPO}/issues?{query}", paginate=True)):
                  if issue.get("pull_request") or issue.get("state") != "open":
                      continue
                  found = UMBRELLA_RE.search(issue.get("body") or "")
                  if found and int(found.group(1)) == UMBRELLA:
                      children[issue["number"]] = issue.get("title", "")
              match = PAYLOAD_RE.search(BODY)
              payload = json.loads(match.group(1)) if match else {}
              if payload.get("payloadVersion") == 2:
                  for row in payload.get("candidates", []):
                      number = row.get("child")
                      if number is None:
                          continue
                      if not isinstance(number, int) or isinstance(number, bool):
                          raise RuntimeError(f"candidate {row.get('id')!r} has a non-numeric child link")
                      try:
                          live = json.loads(gh_api(f"repos/{REPO}/issues/{number}"))
                      except ChildAbsent:
                          # Definitive 404/410: the child was deleted or transferred. It cannot block.
                          print(f"::notice::candidate {row.get('id')!r} child #{number} is absent (HTTP 404/410); not blocking the gate", file=sys.stderr)
                          continue
                      if live.get("state") == "open" and not live.get("pull_request"):
                          children[number] = live.get("title", "")
              print(json.dumps([{"number": n, "title": children[n]} for n in sorted(children)]))


          try:
              main()
          except Exception as exc:  # any list, get or parse failure is unknown evidence
              print(f"child lookup failed: {exc}", file=sys.stderr)
              sys.exit(1)
          PY
          ) || LOOKUP_RC=$?
          if [ "$LOOKUP_RC" -ne 0 ]; then
            fail_closed "The child list or a payload candidate lookup failed (see the job log)."
          fi

          OPEN_COUNT=$(echo "$OPEN_JSON" | jq 'length')
          if [ "$OPEN_COUNT" = "0" ]; then
            echo "All child intakes are resolved."
            echo "gate_passed=true" >> $GITHUB_OUTPUT
          else
            CHILD_LIST=$(echo "$OPEN_JSON" | jq -r '[.[] | "#\(.number) \(.title)"] | join("; ")')
            gh issue comment "$ISSUE_NUMBER" --body "Cannot sync yet: ${OPEN_COUNT} child intake(s) open: ${CHILD_LIST}. Close all child intakes then re-apply upstream:approved. Or add skip-child-gate label to bypass (the bypass never closes or accepts children)."
            echo "gate_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if child gate failed
        if: steps.child_gate.outputs.gate_passed == 'false'
        run: |
          echo "Child gate not passed. Exiting without error (expected state)."
          exit 0

      # ── Create sync branch and run gaia dev sync-upstream ─────────────────
      - name: Create sync branch
        id: branch
        env:
          SKILL_ID: ${{ steps.payload.outputs.skill_id }}
          NEW_VERSION: ${{ steps.payload.outputs.new_version }}
        run: |
          set -euo pipefail

          # Slugify: replace / and non-alphanumeric with -
          SKILL_SLUG=$(echo "$SKILL_ID" | tr '/' '-' | tr -cs 'a-zA-Z0-9-' '-' | sed 's/-$//')
          VERSION_SLUG=$(echo "$NEW_VERSION" | tr -cs 'a-zA-Z0-9-' '-' | sed 's/-$//')
          BRANCH="review/meta/upstream-${SKILL_SLUG}-${VERSION_SLUG}"

          git checkout -B "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      # ── Hotfix 2: bootstrap mode uses --bootstrap flag; --version renamed to --tag
      - name: Run gaia dev sync-upstream
        env:
          GAIA_OPERATOR_OVERRIDE: "1"
          SKILL_ID: ${{ steps.payload.outputs.skill_id }}
          NEW_VERSION: ${{ steps.payload.outputs.new_version }}
          SOURCE_URL: ${{ steps.payload.outputs.source_url }}
          RELEASED_AT: ${{ steps.payload.outputs.released_at }}
          MODE: ${{ steps.payload.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "bootstrap" ]; then
            python -m gaia_cli dev sync-upstream "$SKILL_ID" \
              --tag "$NEW_VERSION" \
              --source-url "$SOURCE_URL" \
              --released-at "$RELEASED_AT" \
              --bootstrap \
              --user "github-actions[bot]"
          else
            python -m gaia_cli dev sync-upstream "$SKILL_ID" \
              --tag "$NEW_VERSION" \
              --source-url "$SOURCE_URL" \
              --released-at "$RELEASED_AT" \
              --mode "$MODE" \
              --user "github-actions[bot]"
          fi

      - name: Freeze removed components
        env:
          GAIA_OPERATOR_OVERRIDE: "1"
          PAYLOAD: ${{ steps.payload.outputs.payload }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          NEW_VERSION: ${{ steps.payload.outputs.new_version }}
        run: |
          set -euo pipefail
          REMOVES=$(echo "$PAYLOAD" | jq -r '.componentRemoves[]? // empty')
          if [ -z "$REMOVES" ]; then
            echo "No components to freeze."
            exit 0
          fi
          while IFS= read -r comp_id; do
            echo "Freezing: $comp_id"
            python -m gaia_cli dev freeze "$comp_id" \
              --reason "removed from umbrella #${ISSUE_NUMBER}@${NEW_VERSION}" || true
          done <<< "$REMOVES"

      - name: Regenerate Class S artifacts
        env:
          GAIA_OPERATOR_OVERRIDE: "1"
        run: |
          python -m gaia_cli dev docs || true

      # ── Hotfix 2: abort if sync produced no real registry changes ──────────
      - name: Verify sync produced real changes
        id: change_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          # Sync-upstream + freeze should have modified files under registry/named/
          # If the ONLY changes are docs regen noise, this was a no-op and we abort.
          REGISTRY_CHANGES=$(git status --porcelain registry/named/ | wc -l)
          if [ "$REGISTRY_CHANGES" -eq 0 ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "::warning::sync-upstream produced no changes to registry/named/. Aborting PR creation."
            gh issue comment "$ISSUE_NUMBER" \
              --body "⚠️ **Sync aborted: no registry changes.** The \`gaia dev sync-upstream\` step ran but did not modify any file under \`registry/named/\`. This usually means the sync silently no-op'd (see PR #1043 for the known argparse clash regression). No PR was opened. Please re-run once diagnostics are complete."
            exit 0
          fi
          echo "no_changes=false" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.change_check.outputs.no_changes != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          NEW_VERSION: ${{ steps.payload.outputs.new_version }}
          SKILL_ID: ${{ steps.payload.outputs.skill_id }}
        run: |
          set -euo pipefail
          # Stage only the paths we intend to commit — defence-in-depth against
          # stray files (e.g. parse_error.txt) leaking into the commit.
          git add registry/named/ registry/gaia.json registry/named-skills.json docs/graph/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(upstream-sync): ${SKILL_ID} → ${NEW_VERSION} [skip-gen]"
          git push --force-with-lease origin "$BRANCH"

      - name: Open draft PR
        if: steps.change_check.outputs.no_changes != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          SKILL_ID: ${{ steps.payload.outputs.skill_id }}
          NEW_VERSION: ${{ steps.payload.outputs.new_version }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          # Re-use existing open draft PR if one already exists for this branch (idempotency)
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
          if [ -n "$PR_URL" ]; then
            echo "Draft PR already exists for $BRANCH: $PR_URL"
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "created=false" >> $GITHUB_OUTPUT
          else
            printf '## Upstream sync: `%s` -> `%s`\n\nAuto-generated by the upstream-approve workflow (upstream:approved on #%s).\n\nFixes #%s\n\n### Scope\nApproval confirms the version bump to `%s` only (and freezes removed components). It does **not** accept any batch row. Rows from #%s that were not escalated to a child intake remain open candidates in that umbrella.\n\n### Changes\n- Updated `upstream:` frontmatter block\n- Froze removed components (see payload in #%s)\n- Regenerated Class S artifacts\n\n### Review checklist\n- [ ] upstream.version is correct\n- [ ] frozen components have installable: false\n- [ ] Class S artifacts look sane\n' \
              "$SKILL_ID" "$NEW_VERSION" "$ISSUE_NUMBER" "$ISSUE_NUMBER" "$NEW_VERSION" "$ISSUE_NUMBER" "$ISSUE_NUMBER" > /tmp/pr_body.md
            PR_URL=$(gh pr create \
              --draft \
              --title "[upstream sync] ${SKILL_ID} -> ${NEW_VERSION}" \
              --body-file /tmp/pr_body.md \
              --base main \
              --head "$BRANCH")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "created=true" >> $GITHUB_OUTPUT
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Comment PR link on umbrella
        if: steps.change_check.outputs.no_changes != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          NEW_VERSION: ${{ steps.payload.outputs.new_version }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          # Avoid duplicate comments if PR link was already posted on umbrella
          ALREADY_COMMENTED=$(gh issue view "$ISSUE_NUMBER" --json comments \
            --jq "[.comments[].body] | any(contains(\"Draft PR #${PR_NUMBER} opened\"))" 2>/dev/null || echo "false")
          if [ "$ALREADY_COMMENTED" = "true" ]; then
            echo "PR link already commented on umbrella #${ISSUE_NUMBER}."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --body "Draft PR #${PR_NUMBER} opened: ${PR_URL} -- Approval confirms the version bump to ${NEW_VERSION} only. Batch rows not escalated to a child intake stay open candidates here and are not accepted. Auto-closes this umbrella on merge (Fixes #${ISSUE_NUMBER} is in the PR body)."
