name: Gaia Steward

# The Class A maintenance pulse.
#
# This workflow is deliberately "repair-ready without auto-merge" (founder
# handover 2026-08-09 § 7). It observes the repository, closes what it is
# authorized to close in a throwaway checkout, and publishes the proof as
# artifacts. It never pushes, never opens an issue or pull request, never
# mutates canonical registry data, and never calls a model — a Class A run
# costs zero tokens.
#
# A quiet day is a healthy day: no debt means no artifact worth reading, and
# the job still passes. The job fails only when Steward itself cannot complete
# a scan, because that means the maintenance nervous system is blind rather
# than idle.

on:
  schedule:
    # 07:10 UTC daily. Off the hour so it does not queue behind the
    # top-of-hour rush.
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaia-steward
  cancel-in-progress: false

jobs:
  class-a:
    name: Class A closed loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the CLI
        run: python -m pip install --quiet -e .

      - name: Observe maintenance debt
        run: gaia steward scan --json > steward-scan.json

      - name: Close authorized Class A debt
        run: gaia steward run --json > steward-run.json

      - name: Summarize
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          def load(name):
              path = pathlib.Path(name)
              if not path.is_file() or not path.read_text().strip():
                  return None
              return json.loads(path.read_text())

          run = load("steward-run.json") or load("steward-scan.json")
          print("## Gaia Steward\n")
          if run is None:
              print("Steward did not produce a receipt. Coverage is unknown.")
              raise SystemExit(0)

          receipt = run["receipt"]
          counts = receipt["authorityCounts"]
          print(f"**Result:** `{receipt['result']['status']}`\n")
          print("| | |")
          print("|---|---:|")
          print(f"| Observations | {receipt['observationsCollected']} |")
          print(f"| Open debt | {len(receipt['openDebt'])} |")
          print(f"| Class A / B / C | {counts.get('A', 0)} / {counts.get('B', 0)} / {counts.get('C', 0)} |")
          print(f"| Repairs | {len(receipt['repairs'])} |")
          print(f"| Blocked | {len(receipt['blocked'])} |")
          print(f"| Coverage unknown | {len(receipt['coverageUnknown'])} |")
          print(f"| Model dispatches | {len(receipt['models'])} |")
          print("")

          for repair in receipt["repairs"]:
              print(f"### Repaired — `{repair['executor']}`\n")
              print(f"Writable surface: `{repair['writablePath']}`\n")
              for path in repair["repairedPaths"]:
                  print(f"- `{path}`")
              print("")

          for blocked in receipt["blocked"]:
              print(f"### Blocked\n\n{blocked.get('reason', 'unspecified')}\n")

          if receipt["repairs"]:
              print(
                  "The repair is proven in this throwaway checkout only. "
                  "Download `steward-receipts` and apply `steward-repair.patch` "
                  "locally, or run `gaia steward run` yourself, to land it."
              )
          PY

      - name: Capture the repair as a reviewable patch
        if: always()
        run: |
          git add -A
          git diff --cached > steward-repair.patch
          git reset --quiet

      - name: Publish receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-receipts
          if-no-files-found: ignore
          retention-days: 30
          path: |
            steward-scan.json
            steward-run.json
            steward-repair.patch
            .gaia/steward/receipts/

  # The full pipeline in observe mode: every detector, the founder desk, and the
  # CI history the ci-health detector needs. Read-only; its ledger is local to
  # this runner, so the desk reports `ledger_local_only` until the founder
  # enables the persistent job below.
  full-observe:
    name: Full pipeline (observe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the CLI
        run: python -m pip install --quiet -e .

      - name: Collect CI history for the ci-health detector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --branch main --limit 200 \
            --json workflowName,conclusion,headSha,createdAt,url,attempt,status > gh-runs.json
          python scripts/steward_collect_ci_runs.py gh-runs.json \
            --repository "$GITHUB_REPOSITORY" --branch main

      - name: Collect dependency advisories for the dependency-advisory detector
        run: |
          python -m pip install --quiet pip-audit
          # pip-audit exits non-zero when it finds vulnerabilities; that is data, not failure.
          pip-audit -f json -o pip-audit.json || test -s pip-audit.json
          python scripts/steward_collect_advisories.py pip-audit.json --repository "$GITHUB_REPOSITORY"

      - name: Restore the previous test history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .gaia/steward/inputs prev
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Gaia Steward" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name steward-test-history --dir prev || true
            [ -f prev/test-history.json ] && cp prev/test-history.json .gaia/steward/inputs/test-history.json || true
          fi

      - name: Run the steward suite and fold it into the test history
        run: |
          python -m pip install --quiet pytest pytest-xdist
          python -m pytest tests/steward -q -p no:cacheprovider --junitxml=junit.xml || true
          python scripts/steward_collect_test_history.py \
            --run "$GITHUB_RUN_ID" "$GITHUB_SHA" junit.xml --repository "$GITHUB_REPOSITORY"

      # Exit 3 means a detector was blind: that fails the job on purpose.
      - name: Observe with every detector
        run: gaia steward full run --observe --trigger scheduled --ledger local --json > steward-full.json

      - name: Founder desk
        if: always()
        run: |
          {
            echo "## Gaia Steward Full"
            echo '```'
            gaia steward full status --ledger local
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist the test history for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-test-history
          if-no-files-found: ignore
          retention-days: 90
          path: .gaia/steward/inputs/test-history.json

      - name: Publish the full-run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-full
          if-no-files-found: ignore
          retention-days: 30
          path: |
            steward-full.json
            .gaia/steward/receipts/
            .gaia/steward/full/

  # Persistent ledger and Class A landing. Off until the founder sets the
  # repository variables STEWARD_LANDING_ENABLED=true and
  # STEWARD_INTEGRATION_BRANCH=dev/<name> (decision steward-landing-target).
  # It may write only refs/heads/steward/ledger and steward/a/* branches; the
  # runner refuses main, master and the default branch, never force-pushes and
  # never merges. It dispatches no agents and opens no pull requests: those
  # remain pending actions for a driver.
  full-land:
    name: Full pipeline (ledger and Class A landing)
    if: vars.STEWARD_LANDING_ENABLED == 'true' && vars.STEWARD_INTEGRATION_BRANCH != ''
    needs: full-observe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the CLI
        run: python -m pip install --quiet -e .

      - name: Commit identity for landing branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run the pipeline without agents
        env:
          INTEGRATION_BRANCH: ${{ vars.STEWARD_INTEGRATION_BRANCH }}
        run: |
          gaia steward full run --trigger scheduled --no-agents --ledger git \
            --integration-branch "$INTEGRATION_BRANCH" --push --json > steward-full-land.json

      - name: Founder desk
        if: always()
        run: |
          {
            echo "## Gaia Steward Full (landing)"
            echo '```'
            gaia steward full status --ledger git
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the landing receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-full-land
          if-no-files-found: ignore
          retention-days: 30
          path: |
            steward-full-land.json
            .gaia/steward/receipts/
