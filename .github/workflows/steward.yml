name: Gaia Steward

# The Class A maintenance pulse.
#
# This workflow is deliberately "repair-ready without auto-merge" (founder
# handover 2026-08-09 § 7). It observes the repository, closes what it is
# authorized to close in a throwaway checkout, and publishes the proof as
# artifacts. It never pushes, never opens an issue or pull request, never
# mutates canonical registry data, and never calls a model — a Class A run
# costs zero tokens.
#
# A quiet day is a healthy day: no debt means no artifact worth reading, and
# the job still passes. The job fails only when Steward itself cannot complete
# a scan, because that means the maintenance nervous system is blind rather
# than idle.

on:
  schedule:
    # 07:10 UTC daily. Off the hour so it does not queue behind the
    # top-of-hour rush.
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaia-steward
  cancel-in-progress: false

env:
  GAIA_STEWARD_LEDGER_MAX_BYTES: ${{ vars.GAIA_STEWARD_LEDGER_MAX_BYTES || '8388608' }}

jobs:
  class-a:
    name: Class A closed loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the CLI
        run: python -m pip install --quiet -e .

      - name: Observe maintenance debt
        run: gaia steward scan --json > steward-scan.json

      - name: Close authorized Class A debt
        run: gaia steward run --json > steward-run.json

      - name: Summarize
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          def load(name):
              path = pathlib.Path(name)
              if not path.is_file() or not path.read_text().strip():
                  return None
              return json.loads(path.read_text())

          run = load("steward-run.json") or load("steward-scan.json")
          print("## Gaia Steward\n")
          if run is None:
              print("Steward did not produce a receipt. Coverage is unknown.")
              raise SystemExit(0)

          receipt = run["receipt"]
          counts = receipt["authorityCounts"]
          print(f"**Result:** `{receipt['result']['status']}`\n")
          print("| | |")
          print("|---|---:|")
          print(f"| Observations | {receipt['observationsCollected']} |")
          print(f"| Open debt | {len(receipt['openDebt'])} |")
          print(f"| Class A / B / C | {counts.get('A', 0)} / {counts.get('B', 0)} / {counts.get('C', 0)} |")
          print(f"| Repairs | {len(receipt['repairs'])} |")
          print(f"| Blocked | {len(receipt['blocked'])} |")
          print(f"| Coverage unknown | {len(receipt['coverageUnknown'])} |")
          print(f"| Model dispatches | {len(receipt['models'])} |")
          print("")

          for repair in receipt["repairs"]:
              print(f"### Repaired — `{repair['executor']}`\n")
              print(f"Writable surface: `{repair['writablePath']}`\n")
              for path in repair["repairedPaths"]:
                  print(f"- `{path}`")
              print("")

          for blocked in receipt["blocked"]:
              print(f"### Blocked\n\n{blocked.get('reason', 'unspecified')}\n")

          if receipt["repairs"]:
              print(
                  "The repair is proven in this throwaway checkout only. "
                  "Download `steward-receipts` and apply `steward-repair.patch` "
                  "locally, or run `gaia steward run` yourself, to land it."
              )
          PY

      - name: Capture the repair as a reviewable patch
        if: always()
        run: |
          git add -A
          git diff --cached > steward-repair.patch
          git reset --quiet

      - name: Publish receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-receipts
          if-no-files-found: ignore
          retention-days: 30
          path: |
            steward-scan.json
            steward-run.json
            steward-repair.patch
            .gaia/steward/receipts/

  # Browser rendering runs here and nowhere else. This job has a read-only token, no persisted git credentials
  # and no secrets, installs its single dependency with `npm ci --ignore-scripts` (no package lifecycle script
  # runs), and hands the privileged job a plain artifact that `scripts/steward_accept_browser_render.py` validates
  # as data. Headless Chromium is free and on by default; a real/interactive browser is never used in CI.
  browser-collect:
    name: Browser render collection (unprivileged)
    runs-on: ubuntu-latest
    outputs:
      # The consumer compares this with the attempt written into the artifact and with its own attempt. After a re-run of
      # failed jobs a successful earlier producer keeps its OLD output, so a replayed artifact cannot pass as current.
      attempt: ${{ steps.attempt.outputs.id }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Record this job's run and attempt
        id: attempt
        run: echo "id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # POLICY.yaml `browser.headless: false` switches collection off; the privileged job records that as refused.
      - name: Read the headless setting from POLICY.yaml
        id: policy
        run: |
          if awk '/^browser:/{f=1;next} /^[^ #]/{f=0} f' founder/steward/POLICY.yaml | grep -Eq '^[[:space:]]+headless:[[:space:]]*false'; then
            echo "headless=false" >> "$GITHUB_OUTPUT"
          else
            echo "headless=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the collector dependency without lifecycle scripts
        id: deps
        if: steps.policy.outputs.headless == 'true'
        continue-on-error: true
        working-directory: scripts/steward-browser
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install headless Chromium
        id: chromium
        if: steps.policy.outputs.headless == 'true'
        continue-on-error: true
        working-directory: scripts/steward-browser
        run: npx playwright install --with-deps chromium

      - name: Record an install failure
        if: always() && (steps.deps.outcome == 'failure' || steps.chromium.outcome == 'failure')
        run: node scripts/steward_collect_browser_render.js --record-failure chromium-install-failed

      - name: Collect rendered-frontend facts (headless)
        id: collect
        if: steps.policy.outputs.headless == 'true' && steps.deps.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/steward-browser/node_modules
        run: node scripts/steward_collect_browser_render.js --repository "$GITHUB_REPOSITORY"

      # upload-artifact@v4 skips hidden paths, so the two files are staged in a visible directory. When collection was
      # attempted a status file always exists (the collector or --record-failure writes one), so a missing handoff is
      # an error, never silently ignored.
      # The collector's files are handed over ONLY when the collect step actually succeeded. A collector that wrote
      # `ok` and then exited nonzero (outcome failure) must not be accepted: its render is dropped and the status is
      # rewritten as failed. If collection never ran (an install failed), the install-failure status already exists.
      # The producer's own run and attempt are written into the artifact so the consumer can refuse a replayed one.
      - name: Stage the render and status for the handoff
        if: always() && steps.policy.outputs.headless == 'true'
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -e
          inputs=.gaia/steward/inputs
          mkdir -p browser-render-handoff "$inputs"
          if [ "$COLLECT_OUTCOME" = "success" ]; then
            for f in browser-render.json browser-render-status.json; do
              if [ -f "$inputs/$f" ]; then cp "$inputs/$f" browser-render-handoff/; fi
            done
          else
            rm -f "$inputs/browser-render.json"
            if [ "$COLLECT_OUTCOME" = "failure" ]; then
              node scripts/steward_collect_browser_render.js --record-failure collection-error
            fi
            if [ -f "$inputs/browser-render-status.json" ]; then cp "$inputs/browser-render-status.json" browser-render-handoff/; fi
          fi
          printf '{"schemaVersion":"steward-browser-render-attempt-v1","attemptId":"%s-%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > browser-render-handoff/browser-render-attempt.json
          if [ ! -f browser-render-handoff/browser-render-status.json ]; then
            echo "::error title=browser handoff::no collection status was produced"
            exit 1
          fi

      - name: Publish the render artifact
        if: always() && steps.policy.outputs.headless == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: steward-browser-render
          if-no-files-found: error
          retention-days: 7
          path: browser-render-handoff/

  # The full pipeline in observe mode: every detector, the founder desk, and the
  # three driver inputs (CI runs, advisories, test history). Read-only; its ledger
  # is local to this runner. The persistent ledger, Class A landing and the
  # unattended Class B builder/verifier loop live in steward-full.yml.
  full-observe:
    name: Full pipeline (observe)
    needs: browser-collect
    # Observe even when the browser job failed: that is then a recorded failed collection, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The validator binds the accepted render to this attempt and the run refuses any render that is not bound to it.
      STEWARD_BROWSER_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
      STEWARD_BROWSER_PRODUCER_ATTEMPT: ${{ needs.browser-collect.outputs.attempt }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the CLI
        run: python -m pip install --quiet -e .

      # Each collector records its own outcome in $RUNNER_TEMP/inputs-*.txt so the
      # report step can show exactly which input is missing, failed or partial.
      - name: Collect CI history for the ci-health detector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run list --repo "$GITHUB_REPOSITORY" --branch main --limit 200 \
               --json workflowName,conclusion,headSha,createdAt,url,attempt,status > gh-runs.json \
             && python scripts/steward_collect_ci_runs.py gh-runs.json \
               --repository "$GITHUB_REPOSITORY" --branch main; then
            echo "ci-runs=ok" > "$RUNNER_TEMP/inputs-ci.txt"
          else
            echo "ci-runs=failed:collector exited non-zero; ci-health is NOT EVALUATED" > "$RUNNER_TEMP/inputs-ci.txt"
          fi

      - name: Collect dependency advisories for the dependency-advisory detector
        run: |
          python -m pip install --quiet pip-audit
          # pip-audit exits non-zero when it finds vulnerabilities; that is data, not failure.
          pip-audit -f json -o pip-audit.json || true
          if [ -s pip-audit.json ] && python scripts/steward_collect_advisories.py pip-audit.json --repository "$GITHUB_REPOSITORY"; then
            echo "advisories=ok" > "$RUNNER_TEMP/inputs-adv.txt"
          else
            echo "advisories=failed:pip-audit produced no usable report; dependency-advisory is NOT EVALUATED" > "$RUNNER_TEMP/inputs-adv.txt"
          fi

      - name: Restore the previous test history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .gaia/steward/inputs prev
          # Newest artifact of that name from any run, not only successful ones: a run that
          # exits 3 (a blind detector) still produced a valid history.
          rid=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=steward-test-history&per_page=1" --jq '.artifacts[0].workflow_run.id // empty' 2>/dev/null || true)
          if [ -z "$rid" ]; then
            echo "test-history=missing:no earlier steward-test-history artifact (first run, or expired after 90 days); history starts empty" > "$RUNNER_TEMP/inputs-hist.txt"
          elif gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name steward-test-history --dir prev && [ -f prev/test-history.json ]; then
            cp prev/test-history.json .gaia/steward/inputs/test-history.json
            echo "test-history=ok:restored from run $rid" > "$RUNNER_TEMP/inputs-hist.txt"
          else
            echo "test-history=failed:artifact from run $rid could not be downloaded; history starts empty" > "$RUNNER_TEMP/inputs-hist.txt"
          fi

      # The last verified closed-issue count (founder ruling steward-census-empty-page-crosschecks) is a DIAGNOSTIC
      # baseline: losing it degrades diagnostics and gates no write. It lives in an Actions artifact (no new git-ref
      # writer), restored here and re-uploaded by every run that holds one, which renews its 90-day retention.
      #   restored        the latest unexpired baseline was downloaded -> compared and renewed
      #   empty-store     none exists (a first run, or every earlier one expired) -> the census seeds one ONLY from a
      #                   verified complete scan and labels it "seeded (no prior baseline retrievable)"
      #   restore-failed  the artifact API or the download failed -> never seeds; the baseline is not evaluated
      # A downloaded file that is corrupt or about another repository is detected by the census (restore-invalid): it is
      # preserved as evidence, never treated as restored, and a verified complete scan seeds "(prior baseline invalid)".
      - name: Restore the closed-issue baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .gaia/steward/inputs prev-baseline
          state=restored
          if ! json=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=steward-closed-baseline&per_page=10" 2>/dev/null); then
            state=restore-failed
          else
            rid=$(jq -r '[.artifacts[] | select(.expired == false)] | .[0].workflow_run.id // empty' <<<"$json")
            if [ -z "$rid" ]; then
              state=empty-store
            elif gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name steward-closed-baseline --dir prev-baseline \
                 && [ -f prev-baseline/closed-issue-baseline.json ]; then
              cp prev-baseline/closed-issue-baseline.json .gaia/steward/inputs/closed-issue-baseline.json
            else
              state=restore-failed
            fi
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          case "$state" in
            restored) echo "closed-baseline=ok:restored from the artifact store" > "$RUNNER_TEMP/inputs-baseline.txt" ;;
            empty-store) echo "closed-baseline=missing:no baseline is retrievable (first run or expired); one is seeded only from a verified complete census and labelled as seeded" > "$RUNNER_TEMP/inputs-baseline.txt" ;;
            *) echo "closed-baseline=failed:the artifact store could not be read; no baseline is seeded or written and the baseline is NOT EVALUATED" > "$RUNNER_TEMP/inputs-baseline.txt" ;;
          esac

      # The GitHub issue census for the issue-hygiene sensor (routine 18). Read-only REST. A partial
      # or failed census is written or left absent, so the sensor reports not evaluated, never healthy.
      - name: Collect the GitHub issue census for the issue-hygiene sensor
        id: census
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_STATE: ${{ steps.baseline.outputs.state }}
        # Exit 4 or 5 (an invalid restored baseline could not be preserved; 5 when the census is also incomplete) fails
        # this step visibly but must not stop the observation. The census status is read from the written file's own
        # completeness fields, never inferred from the exit code, so the two conditions are reported independently.
        continue-on-error: true
        run: |
          code=0
          python scripts/steward_issue_census.py --repo "$GITHUB_REPOSITORY" \
            --out .gaia/steward/inputs/github-issues.json --baseline-state "$BASELINE_STATE" || code=$?
          census=.gaia/steward/inputs/github-issues.json
          complete=missing
          if [ -f "$census" ]; then complete=$(jq -r '.completeness.issues.complete | tostring' "$census" 2>/dev/null || echo missing); fi
          case "$code" in
            0|4)
              if [ "$complete" = "true" ]; then state=ok; elif [ "$complete" = "false" ]; then state=partial; else state=failed; fi ;;
            3|5) if [ "$complete" = "true" ] || [ "$complete" = "false" ]; then state=partial; else state=failed; fi ;;
            *) state=failed ;;
          esac
          case "$state" in
            ok) echo "issue-census=ok" > "$RUNNER_TEMP/inputs-census.txt" ;;
            partial) echo "issue-census=partial:a page failed or was short, or the closed inventory could not be verified; issue closure operations are NOT EVALUATED" > "$RUNNER_TEMP/inputs-census.txt" ;;
            *) echo "issue-census=failed:collector exited $code and its census file is unusable; issue-hygiene is NOT EVALUATED" > "$RUNNER_TEMP/inputs-census.txt" ;;
          esac
          if [ "$code" -eq 4 ] || [ "$code" -eq 5 ]; then
            echo "closed-baseline=failed:the invalid restored baseline could not be preserved; nothing was seeded or overwritten and the baseline is NOT EVALUATED" > "$RUNNER_TEMP/inputs-baseline.txt"
            echo "::error title=steward closed-issue baseline::the invalid restored baseline could not be preserved; no baseline was written"
            exit "$code"
          fi

      # The collector ran in the unprivileged browser-collect job. Only what the validator accepts as data
      # reaches .gaia/steward/inputs; anything else leaves a current failed status, so the browser-render
      # detector reports NOT EVALUATED and an older render is never read as healthy.
      - name: Download the browser-render artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: steward-browser-render
          path: browser-artifact

      - name: Accept the browser-render artifact (validated, headless only)
        if: always()
        run: |
          python scripts/steward_accept_browser_render.py --from browser-artifact | tee "$RUNNER_TEMP/browser-accept.txt"
          if grep -q "artifact: ok" "$RUNNER_TEMP/browser-accept.txt"; then
            echo "browser-render=ok" > "$RUNNER_TEMP/inputs-browser.txt"
          else
            echo "browser-render=failed:$(cat "$RUNNER_TEMP/browser-accept.txt"); rendered frontend facts are NOT EVALUATED" > "$RUNNER_TEMP/inputs-browser.txt"
          fi

      # A failing suite must stay visible but must not stop the observation: it is
      # evidence for the flake detector, and it NEVER counts as a passed verification
      # (Class B verification is the independent verifier plus the PR's own CI).
      - name: Run the steward suite and fold it into the test history
        id: suite
        continue-on-error: true
        run: |
          python -m pip install --quiet pytest pytest-xdist
          set +e
          python -m pytest tests/steward -q -p no:cacheprovider --junitxml=junit.xml
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "test-suite=ok" > "$RUNNER_TEMP/inputs-suite.txt"
          else echo "test-suite=failed:pytest exit $code; failures are recorded in the history, not hidden" > "$RUNNER_TEMP/inputs-suite.txt"; fi
          if [ -f junit.xml ]; then
            python scripts/steward_collect_test_history.py \
              --run "$GITHUB_RUN_ID" "$GITHUB_SHA" junit.xml --repository "$GITHUB_REPOSITORY"
          else
            echo "test-suite=failed:pytest produced no junit.xml; history NOT updated" > "$RUNNER_TEMP/inputs-suite.txt"
          fi
          exit "$code"

      - name: Report driver inputs
        if: always()
        run: |
          args=()
          for f in "$RUNNER_TEMP"/inputs-*.txt; do [ -f "$f" ] && args+=(--item "$(cat "$f")"); done
          python scripts/steward_report_inputs.py "${args[@]}" --history .gaia/steward/inputs/test-history.json

      # Exit 3 means a detector was blind: that fails the job on purpose.
      - name: Observe with every detector
        run: gaia steward full run --observe --trigger scheduled --ledger local --browser-collection external --json > steward-full.json

      - name: Founder desk
        if: always()
        run: |
          {
            echo "## Gaia Steward Full"
            echo '```'
            gaia steward full status --ledger local
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist the test history for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-test-history
          if-no-files-found: ignore
          retention-days: 90
          path: .gaia/steward/inputs/test-history.json

      # upload-artifact@v4 skips hidden paths, so the baseline is staged in a visible directory. Every run that holds a
      # baseline re-uploads it, which renews the artifact's 90-day retention. A failed restore holds none, so nothing is
      # uploaded and stored evidence is never replaced. A missing file is a visible warning, not a silent skip.
      - name: Stage the closed-issue baseline for upload
        if: always() && steps.baseline.outputs.state != 'restore-failed' && steps.census.outcome != 'failure'
        run: |
          mkdir -p closed-baseline-handoff closed-baseline-invalid
          if [ -f .gaia/steward/inputs/closed-issue-baseline.json ]; then
            cp .gaia/steward/inputs/closed-issue-baseline.json closed-baseline-handoff/
          else
            echo "::warning title=steward closed-issue baseline::no baseline exists to persist (the census was incomplete before one could be seeded)"
          fi
          if [ -f .gaia/steward/inputs/closed-issue-baseline.restore-invalid.json ]; then
            cp .gaia/steward/inputs/closed-issue-baseline.restore-invalid.json closed-baseline-invalid/
            echo "::warning title=steward closed-issue baseline::the restored baseline was invalid and is preserved as an artifact"
          fi

      - name: Persist the closed-issue baseline for the next run
        if: always() && steps.baseline.outputs.state != 'restore-failed' && hashFiles('closed-baseline-handoff/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: steward-closed-baseline
          if-no-files-found: error
          retention-days: 90
          path: closed-baseline-handoff/

      - name: Preserve an invalid restored baseline as evidence
        if: always() && hashFiles('closed-baseline-invalid/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: steward-closed-baseline-restore-invalid
          if-no-files-found: error
          retention-days: 90
          path: closed-baseline-invalid/

      - name: Publish the full-run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-full
          if-no-files-found: ignore
          retention-days: 30
          path: |
            steward-full.json
            .gaia/steward/receipts/
            .gaia/steward/full/
