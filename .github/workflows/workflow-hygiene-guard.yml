name: Workflow Hygiene Guard

# Blocking ratchet: no new GitHub Actions job without timeout-minutes.
# Detection is the Steward ci-workflow sensor's own rule; the gate only compares
# it with scripts/lint/workflow-timeout-baseline.json, which may only shrink.
# gh-aw generated *.lock.yml files are reported, never blocking (see the script
# docstring). zizmor runs advisory only (triage: scripts/lint/zizmor-triage.md).
#
# Run the same thing locally:
#   python3 scripts/check_workflow_hygiene.py

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check_workflow_hygiene.py'
      - 'scripts/lint/workflow-timeout-baseline.json'
      - 'src/gaia_cli/steward/sensors_ci.py'
  push:
    branches:
      - main
      - 'dev/**'
    paths:
      - '.github/workflows/**'
      - 'scripts/check_workflow_hygiene.py'
      - 'scripts/lint/workflow-timeout-baseline.json'
      - 'src/gaia_cli/steward/sensors_ci.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-hygiene:
    name: Workflow Hygiene Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install gate dependency
        run: python3 -m pip install "pyyaml>=6.0"

      - name: Run missing-timeout ratchet
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Stale entries (a job repaired without pruning the baseline) warn only
          # on dev/* integration branches, so one-file Steward repair lanes stay
          # green; they fail everywhere else, including the main gate. Prune once
          # per integration. Every event compares against a base ref.
          stale=fail
          case "$EVENT_NAME" in
            pull_request)
              base="origin/$PR_BASE"
              case "$PR_BASE" in dev/*) stale=warn ;; esac
              ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ -n "${PUSH_BEFORE//0/}" ]; then
                base="$PUSH_BEFORE"
              else
                base="HEAD~1"
              fi
              case "$PUSH_REF" in refs/heads/dev/*) stale=warn ;; esac
              ;;
            *)
              base="origin/main"
              ;;
          esac
          python3 scripts/check_workflow_hygiene.py --stale "$stale" --base-ref "$base"

      - name: Install zizmor (advisory)
        continue-on-error: true
        run: python3 -m pip install "zizmor==1.32.0"

      - name: zizmor (advisory, never blocking)
        continue-on-error: true
        run: |
          zizmor --offline --min-severity high --min-confidence high .github/workflows/ || true
